  if(!again){ const lp=_leaseParties(L); _idPrefetch([...lp.landlords,...lp.tenants]).then(n=>{ if(n&&_loTab==='preview')_refreshPreview(true); }); }
}

  function formatPartyDeedLine(party,residingLabel){

// ── DEED OF RENT / TENANCY (Owners / Tenant) ──
function _renderTenancyDeed(L,landlord,tenantList,prop,propDesc,tenure,rentWords,secWords,rentBracketStr,maintDesc,inclDesc,elecText){
  const P=S.parties||[];
  const owners=[L.landlordId,...(L.coLandlordIds||[])].filter(Boolean).map(id=>P.find(p=>p.id===id)).filter(Boolean);
  if(!owners.length)owners.push(landlord||{});
  const tenants=tenantList.length?tenantList:[{}];
  const multiO=owners.length>1, multiT=tenants.length>1;
  const O=multiO?'Owners':'Owner', OW='the '+O;
  const T=multiT?'Tenants':'Tenant', TN='the '+T;
  const tFirst=tenants[0]||{};
  const fem=r=>r==='W/o'||r==='D/o';
  const he=multiT?'they':(fem(tFirst.relation)?'she':'he');
  const his=multiT?'their':(fem(tFirst.relation)?'her':'his');
  const ownHis=multiO?'their':(fem((owners[0]||{}).relation)?'her':'his');
  const fixTitle=x=>String(x||'').replace(/\b(Mr|Mrs|Ms|Sh|Smt|Shri|Dr)\.(?=[A-Za-z])/g,'$1. ');
  const nm=p=>p.partyType==='firm'&&p.firmName?'M/s '+p.firmName:fixTitle(p.name||'_______');
  const tNames=tenants.map(nm).join(' and ');
  const amt=n=>Number(n||0).toLocaleString('en-IN');
  const D=s=>s?fmtDeedDate(s):'_______';

  function ids(p){
    const a=[];
    if(p.oci)a.push(`${p.ociType||'OCI'} No. ${p.oci}`);

  const _tctx={rentWords,secWords,rentBracketStr,meterNote,tenure,maint,elec,fixtures,lieu,grace,intr,tNotice,oNotice,insp,juris,tNames,O,OW,T,TN,he,his,ownHis,multiO,multiT};

<h2>DEED OF RENT / TENANCY AGREEMENT</h2>

${L.customClauses&&L.customClauses.length?L.customClauses.map((c,i)=>`<li><span class="deed-cl">${21+i}. ${c.title||'Additional Clause'}:</span> ${c.text}</li>`).join(''):''}

function _idPagesHTML(L,isLL){
  const parts=[], _r=_tplRoles(L.template), PER_PAGE=4;
  const {landlords,tenants}=_leaseParties(L);
  const grid=pics=>{ let h=''; for(let i=0;i<pics.length;i+=2){ h+='<div class="deed-id-grid">'+pics.slice(i,i+2).map(x=>`<div class="deed-id-cell"><strong style="font-size:11px;">${_h(x.label)}</strong><img src="${x.src}" style="width:100%;height:260px;object-fit:contain;display:block;border:1px solid #ddd;margin-top:4px;"/></div>`).join('')+'</div>'; } return h; };
  // pack people onto pages: at most 4 pictures a page; a person with more pictures continues on the next page
  const section=(people,role,isL)=>{
    const blocks=[];
    people.forEach(p=>{ const pics=_leasePrintPics(L,p,isL); for(let i=0;i<pics.length;i+=PER_PAGE)blocks.push({p,pics:pics.slice(i,i+PER_PAGE),cont:i>0}); });
    const pages=[]; let cur=[], n=0;
    blocks.forEach(b=>{ if(n+b.pics.length>PER_PAGE&&cur.length){ pages.push(cur); cur=[]; n=0; } cur.push(b); n+=b.pics.length; });
    if(cur.length)pages.push(cur);
    pages.forEach((pg,k)=>parts.push(`<div class="deed-pg" style="padding-top:20px;">
      <h4>${role} — ID Proofs${pages.length>1?' ('+(k+1)+' of '+pages.length+')':''}</h4>
      ${pg.map(b=>`<div style="margin-bottom:20px;page-break-inside:avoid;"><p style="font-weight:700;margin-bottom:6px;font-size:12px;border-bottom:1px solid #ccc;padding-bottom:4px;">${role}: ${_h(_pDisp(b.p)||'_______')}${b.cont?' (continued)':''}</p>${grid(b.pics)}</div>`).join('')}
    </div>`));
  };
  section(landlords,_r.l,true);
  section(tenants,_r.t,false);
  return parts.join('');
}

// ── STAMP PAPER PRINT MODE ──
// normal = deed starts at the top · gap = blank space for an e-stamp pasted later · file = attached stamp image
// Older leases (no mode saved) keep printing as before: stamp image if attached, otherwise a blank space.
function _stampMode(L){ if(L&&L.stampMode)return (L.stampMode==='file'&&!L.stampPaperImg)?'gap':L.stampMode; return L&&L.stampPaperImg?'file':'gap'; }
function stampGapMm(L){ const v=Number(L&&L.stampGapMm); return v>=30&&v<=270?v:155; }
function _stampBlockHTML(L,screen){
  const mode=_stampMode(L);
  if(mode==='file'&&L.stampPaperImg){
    return `<div style="width:100%;margin:0 0 2em 0;padding:0 6mm;text-align:center;box-sizing:border-box;overflow:visible;"><img src="${L.stampPaperImg}" style="width:auto;max-width:100%;max-height:${screen?'420px':'252mm'};height:auto;display:block;margin:0 auto;object-fit:contain;"/></div>`;
  }
  if(mode!=='gap')return '';
  const mm=stampGapMm(L);
  // the page's top margin is 18 mm, so the blank block is (mm − 18) tall → the deed text starts mm from the paper's top edge
  if(screen)return `<div style="position:relative;height:0;padding-top:calc(${mm-18} / 174 * 100%);border:2px dashed #CBD5E1;border-radius:6px;margin-bottom:12px;background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 10px,#F1F5F9 10px,#F1F5F9 20px);"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#64748B;font-weight:600;padding:10px;">Space left for e-stamp<br/>Deed text starts ${mm} mm from top of page</div></div>`;
  return `<div class="stamp-gap" style="height:${mm-18}mm;"></div>`;
}

// Page balancer — runs inside the print window just before printing (same rules as RentDesk).
// Lays the deed out in A4-page-sized columns, then:
//   1. last page well filled (≥25%) and no big blank at the bottom of any page → leave as is
//   2. otherwise try a slight tighten (line spacing ≥1.6, gaps ≥75%; font & margins never change) to save a page
//   3. otherwise spread spacing evenly (up to ~2.0 / 150%) so the last page is ≥25% full (20% minimum)
// Annexure and ID-proof pages (which start on their own page) are left out of the measuring.
function _deedBalancer(doc){
  var MM=96/25.4, W=174*MM, H=257*MM; // A4 minus @page margins (18 mm sides & top, 22 mm bottom)
  var root=doc.documentElement, wrap=doc.querySelector('.print-root'); if(!wrap)return null;
  var parent=wrap.parentNode, next=wrap.nextSibling;
  var extra=wrap.querySelectorAll('.deed-pg'); for(var x=0;x<extra.length;x++)extra[x].style.display='none';
  var box=doc.createElement('div');
  box.style.cssText='position:absolute;left:0;top:0;width:'+W+'px;height:'+H+'px;column-width:'+W+'px;column-gap:0;column-fill:auto;visibility:hidden;';
  doc.body.appendChild(box); box.appendChild(wrap);
  function measure(lh,gs){
    root.style.setProperty('--lh',lh); root.style.setProperty('--gs',gs);
    var b0=box.getBoundingClientRect(), bottoms=[];
    function add(r){ if(!r||r.height<=0||r.width<=0)return; var c=Math.max(0,Math.floor((r.left-b0.left+1)/W)); bottoms[c]=Math.max(bottoms[c]||0,r.bottom-b0.top); }
    var tw=doc.createTreeWalker(wrap,4), tn, rg=doc.createRange();
    while((tn=tw.nextNode())){ if(!/\S/.test(tn.nodeValue))continue; rg.selectNodeContents(tn); var rs=rg.getClientRects(); for(var i=0;i<rs.length;i++)add(rs[i]); }
    var els=wrap.querySelectorAll('.stamp-gap,img,.deed-wit-blk,.deed-sig-blk'); for(var j=0;j<els.length;j++){ var er=els[j].getClientRects(); for(var k=0;k<er.length;k++)add(er[k]); }
    var pages=bottoms.length, gaps=0; for(var p=0;p<pages-1;p++)gaps=Math.max(gaps,1-(bottoms[p]||0)/H);
    return{lh:lh,gs:gs,pages:pages,last:(bottoms[pages-1]||0)/H,gaps:gaps};
  }
  var base=measure(1.84,1), tight=[], spread=[];
  [[1.8,0.94],[1.76,0.88],[1.71,0.82],[1.66,0.78],[1.6,0.75]].forEach(function(v){tight.push(measure(v[0],v[1]));});
  for(var t=1;t<=10;t++)spread.push(measure(+(1.84+0.02*t).toFixed(2),+(1+0.05*t).toFixed(2)));
  var all=[base].concat(tight,spread), minGap=Math.min.apply(null,all.map(function(m){return m.gaps;}));
  var gapLimit=Math.max(0.12,minGap+0.03);
  function ok(m){ return m.last>=0.2&&m.gaps<=gapLimit; }
  var pick=null;
  if(ok(base)&&base.last>=0.25)pick=base;
  if(!pick)for(var a=0;a<tight.length&&!pick;a++)if(tight[a].pages<base.pages&&ok(tight[a]))pick=tight[a];
  if(!pick)for(var b=0;b<spread.length&&!pick;b++)if(spread[b].pages<=base.pages&&ok(spread[b])&&(spread[b].last>=0.25||spread[b].pages<base.pages))pick=spread[b];
  if(!pick&&ok(base))pick=base;
  if(!pick){ // nothing perfect — closest to the goal without adding a page, preferring normal spacing on ties
    var score=function(m){return Math.max(0,0.2-m.last)*2+Math.max(0,m.gaps-gapLimit)+(m.pages>base.pages?9:0);};
    pick=all.reduce(function(x,y){return score(y)<score(x)-0.001?y:x;},base);
  }
  root.style.setProperty('--lh',pick.lh); root.style.setProperty('--gs',pick.gs);
  for(var y=0;y<extra.length;y++)extra[y].style.display='';
  if(next)parent.insertBefore(wrap,next); else parent.appendChild(wrap);
  box.parentNode.removeChild(box);
  root.setAttribute('data-balance',JSON.stringify({base:base,pick:pick}));
  return{base:base,pick:pick};
}

// ── WORD (.docx) COPY OF THE DEED ──
// Rebuilds the deed shown on screen as a real Word document (opens in Word, Google Docs, WPS on phone or laptop),
// with the same look as the PDF: Times New Roman, justified text, same spacing, underlined headings, side-by-side
// witness & signature lines, A4 margins, "Page X of Y". ID-photo pages and the stamp-paper picture stay in the PDF only.
function _loadDocxLib(){
  if(window.docx&&window.docx.Packer)return Promise.resolve();
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load the Word maker — check internet')); document.head.appendChild(s); });
}
// opt: {fontPt, lineMult, margins:{top,bottom,left,right} (mm), topGapMm, pageBreakDivs (true = .deed-pg starts a new page), title}
function deedToDocx(root,opt){
  const D=window.docx, pt=n=>Math.round(n*20), mm=n=>Math.round(n*56.6929), px=n=>n*0.75;   // twips; CSS px → pt
  const F=opt.fontPt||10, LINE=Math.round((opt.linePt||F*(opt.lineMult||1.8))*20);
  const body=[];
  const _M=opt.margins||{top:10,bottom:15,left:18,right:18}, CW=mm(210-_M.left-_M.right);   // text width on an A4 page
  let pendingBreak=false, firstPara=true, pendingBefore=0, holdTogether=false;   // holdTogether: closing block (IN WITNESS … signatures) stays on one page
  const runs=(node,fmt,out)=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){ const t=n.nodeValue.replace(/\s+/g,' '); if(t)out.push(new D.TextRun({text:t,bold:!!fmt.b,italics:!!fmt.i,underline:fmt.u?{}:undefined,size:fmt.size,characterSpacing:fmt.cs})); return; }
      if(n.nodeType!==1)return;
      const tag=n.tagName.toLowerCase(); if(tag==='img'||tag==='embed'||tag==='script'||tag==='style')return;
      if(tag==='br'){ out.push('BR'); return; }
      const st=n.getAttribute('style')||'', cls=n.className||'';
      const f={...fmt};
      if(tag==='strong'||tag==='b'||/font-weight:\s*(700|bold)/.test(st))f.b=true;
      if(tag==='em'||tag==='i')f.i=true;
      if(tag==='u'||/text-decoration:\s*underline/.test(st))f.u=true;
      if(/\bdeed-cl\b/.test(cls)){ f.b=true; f.u=true; }
      const fs=st.match(/font-size:\s*([\d.]+)px/); if(fs)f.size=Math.round(px(+fs[1])*2);
      runs(n,f,out);
    });
    return out;
  };
  const para=(el,o)=>{
    const st=(el.getAttribute&&el.getAttribute('style'))||'', cls=(el.className||'');
    const center=o.center||/text-align:\s*center/.test(st), bold=o.b||/font-weight:\s*(700|bold)/.test(st);
    const mt=st.match(/margin-top:\s*(?:calc\()?\s*([\d.]+)px/), mb=st.match(/margin-bottom:\s*([\d.]+)px/);
    const all=runs(el,{b:bold,u:o.u,size:o.size,cs:o.cs},[]);
    while(all.length&&all[all.length-1]==='BR')all.pop();
    if(!all.length)return;
    const lines=[[]]; all.forEach(k=>{ if(k==='BR')lines.push([]); else lines[lines.length-1].push(k); });
    let before=(o.before!=null?o.before:(mt?pt(px(+mt[1])):0))+pendingBefore; pendingBefore=0;
    if(firstPara&&opt.topGapMm>0){ before+=mm(opt.topGapMm); }
    firstPara=false;
    const after=o.after!=null?o.after:(mb?pt(px(+mb[1])):pt(px(opt.pAfterPx||11)));
    lines.forEach((kids,i)=>{
      const last=i===lines.length-1;
      body.push(new D.Paragraph({children:kids.length?kids:[new D.TextRun('')],alignment:center?D.AlignmentType.CENTER:D.AlignmentType.JUSTIFIED,
        spacing:{before:i===0?before:0,after:last?after:0,line:o.line||LINE,lineRule:'atLeast'},
        keepNext:!!o.keepNext||!last||holdTogether,keepLines:!!o.keepLines||holdTogether,pageBreakBefore:i===0&&pendingBreak}));
    });
    pendingBreak=false;
  };
  const noBorder={style:D.BorderStyle.NONE,size:0,color:'FFFFFF'};
  const brk=a=>a.map(k=>k==='BR'?new D.TextRun({break:1}):k);
  const twoCol=(el,center,minH,keep)=>{
    const cells=[...el.children].filter(c=>/deed-(wit|sig)-blk/.test(c.className));
    if(!cells.length)return;
    const half=Math.floor(CW/2);
    const mk=c=>new D.TableCell({width:{size:half,type:D.WidthType.DXA},
      borders:{top:{style:D.BorderStyle.SINGLE,size:6,color:'333333'},bottom:noBorder,left:noBorder,right:noBorder},   // one continuous line across, like the PDF
      margins:{left:0,right:0,top:mm(1.5)},
      children:[new D.Paragraph({children:brk(runs(c,{},[])),alignment:center?D.AlignmentType.CENTER:D.AlignmentType.LEFT,keepNext:!!keep,keepLines:true,
        spacing:{before:0,after:minH||0,line:LINE,lineRule:'atLeast'}})]});
    body.push(new D.Table({width:{size:half*2,type:D.WidthType.DXA},columnWidths:[half,half],layout:D.TableLayoutType.FIXED,
      borders:{top:noBorder,bottom:noBorder,left:noBorder,right:noBorder,insideHorizontal:noBorder,insideVertical:noBorder},
      rows:[new D.TableRow({cantSplit:true,children:cells.map(mk)})]}));
  };
  // witnesses + signatures in ONE row that cannot break across pages (every Word / Docs / phone viewer honours this)
  const closing=(wit,sig)=>{
    const half=Math.floor(CW/2), line={style:D.BorderStyle.SINGLE,size:6,color:'333333',space:4};
    const wc=[...wit.children].filter(c=>/deed-wit-blk/.test(c.className)), sc=[...sig.children].filter(c=>/deed-sig-blk/.test(c.className));
    const cell=i=>new D.TableCell({width:{size:half,type:D.WidthType.DXA},borders:{top:noBorder,bottom:noBorder,left:noBorder,right:noBorder},
      margins:{left:0,right:0,top:0,bottom:0},
      children:[
        new D.Paragraph({children:wc[i]?brk(runs(wc[i],{},[])):[new D.TextRun('')],border:{top:line},keepNext:true,keepLines:true,
          spacing:{before:0,after:pt(opt.witHpt||0),line:LINE,lineRule:'atLeast'}}),
        // plain gap between the witness line and the signature line (a separate paragraph, so Word draws both lines)
        new D.Paragraph({children:[new D.TextRun('')],keepNext:true,spacing:{before:0,after:0,line:Math.max(40,pt(opt.witGapPt||24)+pt(opt.sigGapPt||24)),lineRule:'exact'}}),
        new D.Paragraph({children:sc[i]?brk(runs(sc[i],{},[])):[new D.TextRun('')],border:{top:line},alignment:D.AlignmentType.CENTER,keepLines:true,
          spacing:{before:0,after:0,line:LINE,lineRule:'atLeast'}})]});
    if(opt.witTopPt)spacer(pt(opt.witTopPt));
    body.push(new D.Table({width:{size:half*2,type:D.WidthType.DXA},columnWidths:[half,half],layout:D.TableLayoutType.FIXED,
      borders:{top:noBorder,bottom:noBorder,left:noBorder,right:noBorder,insideHorizontal:noBorder,insideVertical:noBorder},
      rows:[new D.TableRow({cantSplit:true,children:[cell(0),cell(1)]})]}));
  };
  const spacer=h=>body.push(new D.Paragraph({children:[],spacing:{before:0,after:0,line:Math.max(20,h),lineRule:'exact'},keepNext:true}));
  const table=el=>{
    const rows=[...el.querySelectorAll('tr')];
    const border={style:D.BorderStyle.SINGLE,size:6,color:'333333'};
    const head=rows[0]?[...rows[0].children]:[]; const n=Math.max(1,head.length);
    const wts=head.map(h=>/^\s*(#|no\.?|s\.?\s*no\.?)\s*$/i.test(h.textContent)?0.4:(/desc|item|name|particular/i.test(h.textContent)?2:1));
    const sum=wts.reduce((a,b)=>a+b,0)||n, cols=wts.length?wts.map(w=>Math.floor(CW*w/sum)):[CW];
    body.push(new D.Table({width:{size:cols.reduce((a,b)=>a+b,0),type:D.WidthType.DXA},columnWidths:cols,layout:D.TableLayoutType.FIXED,
      rows:rows.map((tr,ri)=>new D.TableRow({tableHeader:ri===0&&!!tr.querySelector('th'),cantSplit:true,children:[...tr.children].map((td,ci)=>new D.TableCell({width:{size:cols[ci]||cols[0],type:D.WidthType.DXA},
        borders:{top:border,bottom:border,left:border,right:border},margins:{top:mm(1),bottom:mm(1),left:mm(2),right:mm(2)},
        shading:td.tagName==='TH'?{fill:'F0F0F0',type:D.ShadingType.CLEAR,color:'auto'}:undefined,
        children:[new D.Paragraph({children:brk(runs(td,{b:td.tagName==='TH',size:Math.round(px(12)*2)},[])),spacing:{before:0,after:0}})]}))}))}));
    body.push(new D.Paragraph({children:[],spacing:{after:pt(6)}}));
  };
  const walk=el=>{
    [...el.children].forEach(c=>{
      const tag=c.tagName.toLowerCase(), cls=c.className||'';
      if(/stamp-(file|space|gap|ph)|deed-id-page/.test(cls))return;                     // stamp picture / gap handled by topGapMm
      if(tag==='img'||tag==='embed'||tag==='script'||tag==='style')return;
      if(/\bdeed-pg\b/.test(cls)){
        if(c.querySelector('img')&&/ID Proofs/i.test(c.textContent))return;                 // ID-photo pages: PDF only
        if(opt.pageBreakDivs)pendingBreak=true;
        walk(c); return;
      }
      if(tag==='h2')return para(c,{center:true,b:true,u:true,size:Math.round(px(15)*2),cs:22,after:pt(px(opt.h2AfterPx||20)),keepNext:true});
      if(tag==='h3')return para(c,{center:true,b:true,after:pt(px(12)),keepNext:true});
      if(tag==='h4')return para(c,{b:true,u:true,after:pt(px(12)),keepNext:true});
      if(tag==='p'){
        if(/deed-cl/.test(cls))return para(c,{b:true,u:true,before:pt(px(16)),after:pt(px(8)),keepNext:true});
        if(/deed-wit-label/.test(cls))return para(c,{keepNext:true,before:pt(12),after:pt(4)});
        return para(c,{keepNext:/deed-witp/.test(cls)});
      }
      if(tag==='ol'||tag==='ul'){ [...c.children].forEach(li=>para(li,{after:pt(px(opt.liAfterPx||9))})); return; }
      if(tag==='table')return table(c);
      if(/\bdeed-wit\b/.test(cls)){
        let nx=c.nextElementSibling; while(nx&&!/\S/.test(nx.textContent)&&!/deed-sig/.test(nx.className))nx=nx.nextElementSibling;
        if(nx&&/\bdeed-sig\b/.test(nx.className)){ closing(c,nx); nx.dataset.done='1'; return; } if(opt.witTopPt)spacer(pt(opt.witTopPt)); twoCol(c,false,pt(opt.witHpt||0),true); spacer(pt(opt.witGapPt||24)); return; }
      if(c.dataset&&c.dataset.done)return;
      if(/\bdeed-sig\b/.test(cls)){ spacer(pt(opt.sigGapPt||24)); twoCol(c,true,0); return; }
      if(tag==='div'||tag==='section'){ const m=(c.getAttribute('style')||'').match(/margin-top:\s*([\d.]+)px/); if(m)pendingBefore+=pt(px(+m[1]));
        const hold=/deed-witness-section|deed-final/.test(cls)&&!holdTogether; if(hold)holdTogether=true; walk(c); if(hold)holdTogether=false; return; }
      para(c,{});
    });
  };
  walk(root);
  const M=_M;
  const doc=new D.Document({
    creator:'KD Constructions',title:opt.title||'Lease Deed',
    styles:{default:{document:{run:{font:'Times New Roman',size:F*2,color:'111111'},paragraph:{spacing:{line:LINE,lineRule:'atLeast'}}}}},
    sections:[{properties:{page:{size:{width:mm(210),height:mm(297)},margin:{top:mm(M.top),bottom:mm(M.bottom),left:mm(M.left),right:mm(M.right),footer:mm(6)}}},
      footers:{default:new D.Footer({children:[new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun({children:['Page ',D.PageNumber.CURRENT,' of ',D.PageNumber.TOTAL_PAGES],size:18,color:'777777',font:'Times New Roman'})]})]})},
      children:body}]});
  return D.Packer.toBlob(doc);
}
// save or share the .docx (phone: share sheet → WhatsApp etc.; laptop: download)
async function _shareDocx(blob,name){
  const type='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/android|iphone|ipad/i.test(navigator.userAgent)){
    try{ await navigator.share({files:[file],title:name}); return 'shared'; }catch(e){ if(e&&e.name==='AbortError')return 'cancelled'; }
  }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  return 'downloaded';
}

// ── COMMON METER (shared common-area / lift sub-meter split between floors) ──
// S.meters = [{id,name,address,rate,collectorId,payTo,floors:[{id,name,share,person,phone}],
//              openingReading,openingDate,readings:[{id,date,prev,reading,rate,units,amount,shares:[{floorId,amount}],paid:{floorId:true}}]}]
const _mInr=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const _mNum=n=>(Number(n)||0).toLocaleString('en-IN');
const _mDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const _mMonth=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'}):'';
function _mGet(id){ return (S.meters||[]).find(m=>m.id===id); }
function _mLast(m){ const r=(m.readings||[]); return r.length?r[r.length-1]:null; }
const _mD=s=>{if(!s)return '—';const[y,mo,d]=String(s).split('-');return d+'/'+mo+'/'+y;};
function _mPrevDate(m){ const l=_mLast(m); return l?l.date:(m.openingDate||''); }
function _mPeriod(r){ return r.prevDate?_mD(r.prevDate)+' to '+_mD(r.date):_mMonth(r.date); }
function _mPrevReading(m){ const l=_mLast(m); return l?Number(l.reading):Number(m.openingReading||0); }
// Split a total by share %, rounding to whole rupees so the parts add up to the total
function _mSplit(total,floors){
  const t=Math.round(total), sum=floors.reduce((a,f)=>a+(Number(f.share)||0),0)||100;
  const raw=floors.map(f=>t*(Number(f.share)||0)/sum), base=raw.map(Math.floor);
  let left=t-base.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-base[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){base[i]++;left--;} });
  return floors.map((f,i)=>({floorId:f.id,amount:base[i]}));
}

  }).join(''):`<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">No buildings yet. Tap “+ Add Building” to set one up.</div></div>`}`;

// ── setup ──
let _mDraft=null;
function openMeterSetup(id){
  const m=id?_mGet(id):null;
  _mDraft=m?JSON.parse(JSON.stringify(m)):{id:'',name:'',address:'',rate:'',openingReading:'',openingDate:today(),payTo:'',
    floors:['Ground Floor','First Floor','Second Floor','Third Floor'].map(n=>({id:'f_'+uid(),name:n,share:25,person:'',phone:''})),collectorId:''};
  if(!_mDraft.collectorId&&_mDraft.floors[1])_mDraft.collectorId=_mDraft.floors[1].id;
  _mSetupRender(m?'✏️ Edit Building':'⚡ Add Building');
}
function _mSetupRender(title){
  const d=_mDraft, sum=d.floors.reduce((a,f)=>a+(Number(f.share)||0),0);
  const props=S.properties||[];
  openM(title||document.getElementById('mTitle').innerHTML,`
    <div class="frow1"><label class="flabel">Building name *</label><input class="finput" id="m_name" value="${_h(d.name)}" placeholder="e.g. E-197 Sushant Lok II" oninput="_mDraft.name=this.value"/></div>
    ${props.length?`<div class="frow1"><label class="flabel">Or pick from Properties</label><select class="fselect" onchange="if(this.value){const p=S.properties.find(x=>x.id===this.value);_mDraft.name=_mDraft.name||((p.name||'').split(',')[0]);document.getElementById('m_name').value=_mDraft.name;}"><option value="">—</option>${props.map(p=>`<option value="${p.id}">${_h(p.name||String(p.address||'').slice(0,40))}</option>`).join('')}</select></div>`:''}
    <div class="frow">
      <div><label class="flabel">Rate per unit (₹) *</label><input class="finput" id="m_rate" type="number" step="0.01" value="${_h(String(d.rate||''))}" placeholder="e.g. 8.50" oninput="_mDraft.rate=this.value"/></div>
      <div><label class="flabel">Opening sub-meter reading</label><input class="finput" id="m_open" type="number" value="${_h(String(d.openingReading||''))}" placeholder="e.g. 12340" oninput="_mDraft.openingReading=this.value" ${(d.readings||[]).length?'disabled title="Already has monthly readings"':''}/></div>
    </div>
    <div class="frow1"><label class="flabel">Opening reading taken on</label><input class="finput" id="m_odate" type="date" value="${_h(d.openingDate||'')}" oninput="_mDraft.openingDate=this.value" ${(d.readings||[]).length?'disabled':''}/></div>
    <div style="font-size:12px;font-weight:700;margin:6px 0 6px;">Floors & shares <span style="font-weight:600;color:${Math.abs(sum-100)<0.01?'var(--green)':'var(--red)'};">(total ${sum}%)</span></div>
    ${d.floors.map((f,i)=>`<div style="border:1px solid var(--border);border-radius:9px;padding:8px;margin-bottom:6px;background:${f.id===d.collectorId?'var(--orange-dim)':'var(--white)'};">
      <div style="display:flex;gap:6px;align-items:center;">
        <input class="finput" style="flex:1;min-width:0;" value="${_h(f.name)}" placeholder="Floor" oninput="_mDraft.floors[${i}].name=this.value"/>
        <input class="finput" style="width:74px;" type="number" step="0.01" value="${_h(String(f.share))}" oninput="_mDraft.floors[${i}].share=this.value;"/><span style="font-size:12px;">%</span>
        ${d.floors.length>1?`<button class="btn btn-red btn-xs" type="button" onclick="_mDraft.floors.splice(${i},1);_mSetupRender()">✕</button>`:''}
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <input class="finput" style="flex:1;min-width:0;" value="${_h(f.person||'')}" placeholder="Who pays (name)" oninput="_mDraft.floors[${i}].person=this.value"/>
        <input class="finput" style="width:130px;" value="${_h(f.phone||'')}" placeholder="Phone" inputmode="tel" oninput="_mDraft.floors[${i}].phone=this.value"/>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;cursor:pointer;"><input type="radio" name="m_coll" ${f.id===d.collectorId?'checked':''} onchange="_mDraft.collectorId='${f.id}';_mSetupRender()"/> Meter is on this floor (others pay this floor)</label>
    </div>`).join('')}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
      <button class="btn btn-ghost btn-xs" type="button" onclick="_mDraft.floors.push({id:'f_'+uid(),name:'Floor '+(_mDraft.floors.length+1),share:0,person:'',phone:''});_mSetupRender()">+ Add floor</button>
      <button class="btn btn-ghost btn-xs" type="button" onclick="const n=_mDraft.floors.length;_mDraft.floors.forEach(f=>f.share=+(100/n).toFixed(2));_mSetupRender()">Split equally</button>
    </div>
    <div class="frow1"><label class="flabel">Payments go to (shown in the message)</label><input class="finput" id="m_payto" value="${_h(d.payTo||'')}" placeholder="e.g. Mr. Shirish Setia (First Floor) — UPI 98xxxxxx" oninput="_mDraft.payTo=this.value"/></div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="saveMeterSetup()">Save Building</button>`);
}
function saveMeterSetup(){
  const d=_mDraft; if(!d)return;
  if(!String(d.name||'').trim()){toast('❌ Building name is required');return;}
  if(!(Number(d.rate)>0)){toast('❌ Enter the rate per unit');return;}
  const sum=d.floors.reduce((a,f)=>a+(Number(f.share)||0),0);
  if(Math.abs(sum-100)>0.5){toast('❌ Shares add up to '+sum+'% — make them 100%');return;}
  if(!S.meters)S.meters=[];
  if(d.id){ const i=S.meters.findIndex(x=>x.id===d.id); if(i>=0)S.meters[i]=d; }
  else { d.id='m_'+uid(); d.readings=[]; d.createdAt=today(); d.createdBy=user; S.meters.push(d); }
  actLog('Common meter saved — '+d.name); sched(); closeM(); renderMeters(); toast('✅ Building saved');
}
function deleteMeter(id){
  const m=_mGet(id); if(!m||!confirm('Delete '+m.name+' and all its readings?'))return;
  S.meters=S.meters.filter(x=>x.id!==id); actLog('Deleted common meter — '+m.name); sched(); renderMeters();
}

// ── monthly reading ──
function openMeterReading(id){
  const m=_mGet(id); if(!m)return;
  const prev=_mPrevReading(m), l=_mLast(m);
  openM('⚡ New Reading — '+_h(m.name),`
    <div class="frow">
      <div><label class="flabel">Old reading</label><input class="finput" type="number" id="mr_prev" value="${prev}" oninput="_mCalc('${id}')"/><div style="font-size:10px;color:var(--muted);margin-top:3px;">${l?'Last saved reading':'Opening reading'}</div></div>
      <div><label class="flabel">Old reading date</label><input class="finput" type="date" id="mr_pdate" value="${_h(_mPrevDate(m))}" oninput="_mCalc('${id}')"/></div>
    </div>
    <div class="frow">
      <div><label class="flabel">New reading *</label><input class="finput" type="number" id="mr_cur" placeholder="e.g. ${prev+500}" oninput="_mCalc('${id}')" style="font-weight:700;"/></div>
      <div><label class="flabel">New reading date *</label><input class="finput" type="date" id="mr_date" value="${today()}" oninput="_mCalc('${id}')"/></div>
    </div>
    <div class="frow1"><label class="flabel">Rate per unit (₹)</label><input class="finput" type="number" step="0.01" id="mr_rate" value="${_h(String(m.rate||''))}" oninput="_mCalc('${id}')"/></div>
    <div id="mr_out"></div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="saveMeterReading('${id}')">Save & Share →</button>`);
  setTimeout(()=>{ const c=document.getElementById('mr_cur'); if(c)c.focus(); _mCalc(id); },50);
}
function _mCalc(id){
  const m=_mGet(id), out=document.getElementById('mr_out'); if(!m||!out)return null;
  const prev=Number(_lv('mr_prev')), cur=Number(_lv('mr_cur')), rate=Number(_lv('mr_rate'));
  if(!_lv('mr_cur')){ out.innerHTML='<div style="font-size:12px;color:var(--muted);">Enter the current reading to see each floor’s share.</div>'; return null; }
  const units=+(cur-prev).toFixed(2);
  const pd=_lv('mr_pdate'), nd=_lv('mr_date');
  if(pd&&nd&&nd<pd){ out.innerHTML='<div style="font-size:12px;color:var(--red);font-weight:600;">New reading date is before the old reading date — please check.</div>'; return null; }
  if(units<0){ out.innerHTML='<div style="font-size:12px;color:var(--red);font-weight:600;">Current reading is lower than the previous one — please check.</div>'; return null; }
  const amount=Math.round(units*rate), shares=_mSplit(amount,m.floors);
  out.innerHTML=`<div style="background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;">
    <div style="display:flex;justify-content:space-between;"><span>${_mNum(units)} units × ₹${rate}</span><b>${_mInr(amount)}</b></div>
    <div style="border-top:1px solid var(--border);margin:8px 0;"></div>
    ${m.floors.map((f,i)=>`<div style="display:flex;justify-content:space-between;padding:2px 0;"><span>${_h(f.name)} (${f.share}%)${f.id===m.collectorId?' <small style="color:var(--muted);">— meter here</small>':''}</span><b>${_mInr(shares[i].amount)}</b></div>`).join('')}
  </div>`;
  return {prev,cur,rate,units,amount,shares,prevDate:pd,date:nd};
}
function saveMeterReading(id){
  const m=_mGet(id); const c=_mCalc(id);
  if(!c){toast('❌ Enter a valid current reading');return;}
  const r={id:'r_'+uid(),date:c.date||today(),prevDate:c.prevDate||'',prev:c.prev,reading:c.cur,rate:c.rate,units:c.units,amount:c.amount,shares:c.shares,paid:{},by:user,at:new Date().toISOString()};
  if(m.collectorId)r.paid[m.collectorId]=true;          // the floor with the meter has already paid the bill
  if(!m.readings)m.readings=[]; m.readings.push(r); m.rate=c.rate;
  actLog(`Common meter reading — ${m.name}: ${c.units} units, ${_mInr(c.amount)}`); sched();
  openMeterBill(id,r.id); renderMeters();
}

// ── bill: view, mark paid, WhatsApp, PDF ──
function _mMsg(m,r){
  const coll=m.floors.find(f=>f.id===m.collectorId);
  const lines=m.floors.map(f=>{ const s=(r.shares.find(x=>x.floorId===f.id)||{}).amount||0;
    return `• ${f.name}${f.person?' ('+f.person+')':''} — *${_mInr(s)}*${f.id===m.collectorId?' _(meter on this floor)_':((r.paid||{})[f.id]?' ✅ paid':'')}`; });
  const allEq=m.floors.every(f=>Number(f.share)===Number(m.floors[0].share));
  return `⚡ *Common Area & Lift Electricity*\n*${m.name}* — ${_mPeriod(r)}\n\n`
    +`Old reading: ${_mNum(r.prev)}${r.prevDate?' dated '+_mD(r.prevDate):''}\nNew reading: ${_mNum(r.reading)} dated ${_mD(r.date)}\n`
    +`Units used: ${_mNum(r.units)} × ₹${r.rate} = *${_mInr(r.amount)}*\n\n`
    +`*Share${allEq?' ('+m.floors[0].share+'% each)':''}:*\n${lines.join('\n')}\n\n`
    +`Please pay your share to ${m.payTo||((coll?coll.name:'')+(coll&&coll.person?' — '+coll.person:''))||'the floor with the meter'}. Thank you 🙏`;
}
function openMeterBill(id,rid){
  const m=_mGet(id), r=m&&(m.readings||[]).find(x=>x.id===rid); if(!r)return;
  openM('📄 '+_h(m.name),`
    <div style="font-size:12px;color:var(--ink2);margin-bottom:8px;">${_mNum(r.prev)} (${_mD(r.prevDate)}) → <b>${_mNum(r.reading)}</b> (${_mD(r.date)}) = <b>${_mNum(r.units)} units</b> × ₹${r.rate} = <b>${_mInr(r.amount)}</b></div>
    <table class="tbl" style="margin-bottom:10px;"><thead><tr><th>Floor</th><th>Share</th><th>Amount</th><th>Paid</th></tr></thead><tbody>
    ${m.floors.map(f=>{ const s=(r.shares.find(x=>x.floorId===f.id)||{}).amount||0; const isC=f.id===m.collectorId;
      return `<tr><td>${_h(f.name)}${f.person?`<div style="font-size:10px;color:var(--muted);">${_h(f.person)}</div>`:''}</td><td>${f.share}%</td><td><b>${_mInr(s)}</b></td>
        <td>${isC?'<span style="font-size:10px;color:var(--muted);">meter</span>':`<input type="checkbox" ${(r.paid||{})[f.id]?'checked':''} onchange="_mPaid('${id}','${rid}','${f.id}',this.checked)"/>`}</td></tr>`; }).join('')}
    </tbody></table>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">WhatsApp message (opens WhatsApp — pick the building group):</div>
    <textarea class="ftextarea" id="mb_msg" style="min-height:190px;font-size:12px;">${_h(_mMsg(m,r))}</textarea>`,
    `<button class="btn btn-ghost" onclick="closeM()">Close</button>
     <button class="btn btn-ghost" onclick="_mPdf('${id}','${rid}')">📄 PDF</button>
     <button class="btn btn-ghost" onclick="_mCopy()">📋 Copy</button>
     <button class="btn" style="background:#25D366;color:#fff;" onclick="window.open('https://wa.me/?text='+encodeURIComponent(document.getElementById('mb_msg').value),'_blank')">💬 WhatsApp</button>`);
}
function _mCopy(){ const t=document.getElementById('mb_msg'); if(!t)return; (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('📋 Message copied')).catch(()=>{t.select();document.execCommand('copy');toast('📋 Message copied');}); }
function _mPaid(id,rid,fid,on){
  const m=_mGet(id), r=m&&(m.readings||[]).find(x=>x.id===rid); if(!r)return;
  if(!r.paid)r.paid={}; if(on)r.paid[fid]=true; else delete r.paid[fid];
  sched(); const t=document.getElementById('mb_msg'); if(t)t.value=_mMsg(m,r); renderMeters();
}
function openMeterHistory(id){
  const m=_mGet(id); if(!m)return;
  const rs=(m.readings||[]).slice().reverse();
  openM('🕑 '+_h(m.name)+' — History',`
    <table class="tbl"><thead><tr><th>Date</th><th>Reading</th><th>Units</th><th>Amount</th><th></th></tr></thead><tbody>
    ${rs.map((r,i)=>{ const due=m.floors.filter(f=>f.id!==m.collectorId&&!(r.paid||{})[f.id]).length;
      return `<tr><td>${_mD(r.date)}${due?`<div style="font-size:10px;color:var(--orange);">${due} to pay</div>`:'<div style="font-size:10px;color:var(--green);">all paid</div>'}</td><td>${_mNum(r.reading)}</td><td>${_mNum(r.units)}</td><td><b>${_mInr(r.amount)}</b></td>
      <td style="white-space:nowrap;"><button class="btn btn-ghost btn-xs" onclick="openMeterBill('${id}','${r.id}')">Open</button>${i===0?` <button class="btn btn-red btn-xs" onclick="_mDelReading('${id}','${r.id}')">🗑</button>`:''}</td></tr>`; }).join('')}
    </tbody></table>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;">Only the latest reading can be deleted, so the chain of readings stays correct.</div>`);

function _mDelReading(id,rid){

}

    +'.foot{margin-top:18px;font-size:12px;color:#444;}@page{size:A4;margin:16mm;}</style></head><body>'
    +'<h1>Common Area & Lift Electricity</h1><div class="sub">'+_h(m.name)+' · '+_mPeriod(r)+'</div>'

}

function _avgAnnualRent(rent,tenure,escPct){
  const months=Math.max(parseInt(tenure)||0,1);
  let total=0;
  for(let m=0;m<months;m++){
    const year=Math.floor(m/12);
    total+=rent*Math.pow(1+(escPct/100),year);
  }
  return Math.round(total/(months/12));
}

// Haryana registration fee slabs — for a lease deed the slab is read on the Average Annual Rent
const HR_REG_SLABS=[[50000,100],[100000,500],[500000,1000],[1000000,5000],[2000000,10000],[2500000,12500],[3000000,15000],[4000000,20000],[5000000,25000],[6000000,30000],[7000000,35000],[8000000,40000],[9000000,45000],[Infinity,50000]];
function _regFeeFromAnnualRent(avgAnnualRent){
  for(const [upto,fee] of HR_REG_SLABS) if(avgAnnualRent<=upto) return fee;
  return 50000;
}

function calcSD(){
  const rent=parseFloat(document.getElementById('sdRent').value)||0;
  const dep=parseFloat(document.getElementById('sdDep').value)||0;
  const tenure=parseInt(document.getElementById('sdTenure').value)||11;
  const esc=parseFloat(document.getElementById('sdEsc')?.value)||0;
  const firstYearRent=rent*12;
  const avgAnnualRent=_avgAnnualRent(rent,tenure,esc);
  const base=avgAnnualRent+dep;
  let stampPct=0,stampNote='';
  if(tenure<=60){stampPct=1.5;stampNote='1.5% of (Average Annual Rent + Deposit) — up to 5 years';}
  else{stampPct=3;stampNote='3% of (Average Annual Rent + Deposit) — more than 5 years';}
  const stampDuty=Math.round(base*stampPct/100);
  const regFee=_regFeeFromAnnualRent(avgAnnualRent);
  const advocateFee=7000;
  const govtTotal=stampDuty+regFee;
  const approxTotal=govtTotal+advocateFee;
  const mandatory=tenure>11;
  const el=document.getElementById('sdResult');
  el.innerHTML=`
  <div style="background:${mandatory?'var(--amber-dim)':'var(--green-dim)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;font-weight:600;color:${mandatory?'var(--amber)':'var(--green)'};">
    ${mandatory?'⚠️ Registration MANDATORY for this tenure':'ℹ️ Registration optional for agreements ≤ 11 months'}
  </div>
  ${rent?`
  <div class="irow"><span class="irow-label">First Year Annual Rent</span><span class="irow-value">${fm(firstYearRent)}</span></div>
  <div class="irow"><span class="irow-label">Average Annual Rent${esc?' (with '+esc+'% yearly escalation)':''}</span><span class="irow-value">${fm(avgAnnualRent)}</span></div>
  <div class="irow"><span class="irow-label">Security Deposit</span><span class="irow-value">${fm(dep)}</span></div>
  <div class="irow"><span class="irow-label">Base for Stamp Duty</span><span class="irow-value">${fm(base)}</span></div>
  <div class="irow"><span class="irow-label">Stamp Duty (${stampNote})</span><span class="irow-value" style="color:var(--orange);">${fm(stampDuty)}</span></div>
  <div class="irow"><span class="irow-label">Registration Fee (lease slab on Average Annual Rent)</span><span class="irow-value" style="color:var(--orange);">${fm(regFee)}</span></div>
  <div class="irow"><span class="irow-label">Advocate Fees (approx)</span><span class="irow-value" style="color:var(--orange);">${fm(advocateFee)}</span></div>
  <div style="background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;margin-top:10px;"><span>Approx Total</span><span>${fm(approxTotal)}</span></div>
  <div style="font-size:10px;color:var(--muted);margin-top:8px;">Govt. charges: ${fm(govtTotal)}. Advocate fee added separately as approx. Always verify final amount with Sub-Registrar office (Gurugram) before payment.</div>`:'<div style="color:var(--muted);text-align:center;padding:12px;">Enter rent amount to calculate</div>'}`;
}

function calcTDS(){
  const baseRent=parseFloat(document.getElementById('tdsRent').value)||0;
  const esc=parseFloat((document.getElementById('tdsEsc')||{}).value)||0;
  const rent=esc?Math.round(baseRent*(1+esc/100)):baseRent;
  const type=document.getElementById('tdsType').value;
  const el=document.getElementById('tdsResult');
  const nri=(document.getElementById('tdsLL')||{}).value==='nri';
  document.getElementById('tdsTypeW').style.display=nri?'none':'';
  document.getElementById('tdsOwnW').style.display=nri?'':'none';
  document.getElementById('tdsNriW').style.display=nri?'':'none';
  if(baseRent&&nri){ calcTDSNri(baseRent,esc,rent,el); return; }
  const escRow=esc&&baseRent?`<div class="irow"><span class="irow-label">Current rent → +${esc}%</span><span class="irow-value">${fm(baseRent)} → <strong>${fm(rent)}</strong></span></div>`:'';
  const threshold=50000;
  if(!rent){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:12px;">Enter rent amount to calculate</div>';return;}
  const applicable=rent>threshold;
  const annualRent=rent*12;
  if(type==='individual'){
    // Section 194IB: 2% (from Oct 2024), deducted once a year (last month)
    const tdsRate=2;
    const annualTDS=Math.round(annualRent*tdsRate/100);
    const netRent=annualRent-annualTDS;
    el.innerHTML=`
    <div style="background:${applicable?'var(--amber-dim)':'var(--green-dim)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;font-weight:600;color:${applicable?'var(--amber)':'var(--green)'};">
      ${applicable?'⚠️ TDS APPLICABLE under Sec 194IB':'✅ TDS NOT applicable — rent below ₹50,000/month threshold'}
    </div>
    ${escRow}${applicable?`
    <div class="irow"><span class="irow-label">Monthly Rent</span><span class="irow-value">${fm(rent)}</span></div>
    <div class="irow"><span class="irow-label">Annual Rent</span><span class="irow-value">${fm(annualRent)}</span></div>
    <div class="irow"><span class="irow-label">TDS Rate (Sec 194IB)</span><span class="irow-value">2% (reduced from 5% w.e.f. Oct 2024)</span></div>
    <div class="irow"><span class="irow-label">Annual TDS Amount</span><span class="irow-value" style="color:var(--red);">${fm(annualTDS)}</span></div>
    <div class="irow"><span class="irow-label">When to deduct</span><span class="irow-value" style="font-size:11px;">Once per year — at credit/payment of last month rent</span></div>
    <div class="irow"><span class="irow-label">Form to file</span><span class="irow-value">Form 26QC (within 30 days)</span></div>
    <div class="irow"><span class="irow-label">TAN required?</span><span class="irow-value" style="color:var(--green);">No — PAN sufficient</span></div>
    <div style="background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;margin-top:10px;"><span>Net to Landlord (annual)</span><span>${fm(netRent)}</span></div>
    <div style="font-size:10px;color:var(--muted);margin-top:8px;">Penalty for non-deduction: Interest @ 1%/month for late deduction, 1.5%/month for late deposit.</div>
    `:''}`;
  } else {
    // Section 194I: 10% for land/building, threshold ₹6L/year from Apr 2025
    const annualThreshold=600000;
    const tdsApplicable=annualRent>annualThreshold;
    const tdsRate=10;
    const annualTDS=tdsApplicable?Math.round(annualRent*tdsRate/100):0;
    el.innerHTML=`
    <div style="background:${tdsApplicable?'var(--amber-dim)':'var(--green-dim)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;font-weight:600;color:${tdsApplicable?'var(--amber)':'var(--green)'};">
      ${tdsApplicable?'⚠️ TDS APPLICABLE under Sec 194I':'✅ TDS NOT applicable — annual rent below ₹6 lakh threshold (from Apr 2025)'}
    </div>
    ${escRow}<div class="irow"><span class="irow-label">Annual Rent</span><span class="irow-value">${fm(annualRent)}</span></div>
    <div class="irow"><span class="irow-label">Threshold (Sec 194I)</span><span class="irow-value">₹6,00,000/year (from Apr 2025)</span></div>
    ${tdsApplicable?`
    <div class="irow"><span class="irow-label">TDS Rate (land/building)</span><span class="irow-value">10%</span></div>
    <div class="irow"><span class="irow-label">Annual TDS Amount</span><span class="irow-value" style="color:var(--red);">${fm(annualTDS)}</span></div>
    <div class="irow"><span class="irow-label">Monthly TDS</span><span class="irow-value" style="color:var(--red);">${fm(Math.round(annualTDS/12))}</span></div>
    <div class="irow"><span class="irow-label">TAN required?</span><span class="irow-value" style="color:var(--red);">Yes — TAN mandatory for Sec 194I</span></div>
    <div style="background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;margin-top:10px;"><span>Net to Landlord (annual)</span><span>${fm(annualRent-annualTDS)}</span></div>`:''}`;
  }
}

// NRI landlord: TDS on every payment, no threshold. 30% + surcharge (by owner's income) + 4% cess.
// Each co-owner is a separate payee — TDS is worked out on his own share.
let _tdsNriMsg='';
function calcTDSNri(baseRent,esc,rent,el){
  const owners=Number(document.getElementById('tdsOwners').value)||1;
  const sur=Number(document.getElementById('tdsInc').value)||0;
  const ldc=parseFloat(document.getElementById('tdsLdc').value);
  const rate=(ldc>=0&&!isNaN(ldc))?ldc:Math.round(30*(1+sur/100)*1.04*100)/100;
  const share=rent/owners;
  const tdsEach=Math.round(share*rate/100), netEach=Math.round(share)-tdsEach;
  const tds=tdsEach*owners, net=rent-tds;
  const f=n=>Number(n).toLocaleString('en-IN');
  const rateTxt=(ldc>=0&&!isNaN(ldc))?rate+'% (lower TDS certificate)':rate+'%';
  _tdsNriMsg=(esc?`Current rent - ${f(baseRent)}\nRent escalation - ${esc}%\n\nRevised rent - ${f(rent)}\n`:`Monthly rent - ${f(rent)}\n`)
    +`TDS @ ${rate}% - ${f(tds)}\n\nBalance - ${f(net)}`+(owners>1?`\n${owners===2?'Half':'1/'+owners} share - ${f(netEach)} each`:'');
  el.innerHTML=`
  <div style="background:var(--amber-dim);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;font-weight:600;color:var(--amber);">⚠️ NRI landlord — TDS on the full rent from the first rupee (no ₹50,000 limit)</div>
  ${esc?`<div class="irow"><span class="irow-label">Current rent → +${esc}%</span><span class="irow-value">${fm(baseRent)} → <strong>${fm(rent)}</strong></span></div>`:`<div class="irow"><span class="irow-label">Monthly Rent</span><span class="irow-value">${fm(rent)}</span></div>`}
  <div class="irow"><span class="irow-label">TDS rate</span><span class="irow-value">${rateTxt}</span></div>
  ${owners>1?`<div class="irow"><span class="irow-label">Each owner's share (${owners} owners)</span><span class="irow-value">${fm(Math.round(share))}</span></div>
  <div class="irow"><span class="irow-label">TDS per owner</span><span class="irow-value" style="color:var(--red);">${fm(tdsEach)}</span></div>
  <div class="irow"><span class="irow-label">Net per owner</span><span class="irow-value" style="color:var(--green);font-weight:700;">${fm(netEach)}</span></div>`:''}
  <div class="irow"><span class="irow-label">Total monthly TDS</span><span class="irow-value" style="color:var(--red);font-weight:700;">${fm(tds)}</span></div>
  <div class="irow"><span class="irow-label">Annual TDS</span><span class="irow-value" style="color:var(--red);">${fm(tds*12)}</span></div>
  <div class="irow"><span class="irow-label">When to deduct</span><span class="irow-value" style="font-size:11px;">Every month, at the time of paying rent</span></div>
  <div class="irow"><span class="irow-label">TAN required?</span><span class="irow-value" style="color:var(--red);">Yes — tenant needs a TAN</span></div>
  <div class="irow"><span class="irow-label">Return / certificate</span><span class="irow-value" style="font-size:11px;">Quarterly NRI TDS return (Form 144, earlier 27Q) · certificate to each owner</span></div>
  <div class="irow"><span class="irow-label">Sending money abroad</span><span class="irow-value" style="font-size:11px;">Form 145 (earlier 15CA); CA certificate Form 146 (earlier 15CB) above ₹5 lakh/yr</span></div>
  <div style="background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;margin-top:10px;"><span>Net to landlord${owners>1?'s':''} (monthly)</span><span>${fm(net)}</span></div>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
    <button class="btn btn-ghost btn-sm" onclick="tdsNriShare('copy')">📋 Copy message</button>
    <button class="btn btn-green btn-sm" onclick="tdsNriShare('wa')">📱 WhatsApp</button>
  </div>
  <div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5;">30% tax + surcharge (by each owner's total Indian income) + 4% cess. Each co-owner is taxed on his own share, against his own PAN. If the owner has a lower/nil TDS certificate from the Income Tax Dept., enter that rate above. India–UK/other tax treaties don't lower TDS on rent from Indian property. Confirm with your CA.</div>`;
}
function tdsNriShare(how){
  if(!_tdsNriMsg)return;
  if(how==='wa'){ window.open('https://wa.me/?text='+encodeURIComponent(_tdsNriMsg),'_blank'); return; }
  const done=()=>toast('📋 Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(_tdsNriMsg).then(done,()=>prompt('Copy this:',_tdsNriMsg)); else prompt('Copy this:',_tdsNriMsg);
}

function _lastBackupText(){
  try{ const t=localStorage.getItem('leasdesk_last_backup'); if(t)return new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){}
  return 'never';
}
const _BK_KINDS=[['parties','Parties (landlords & tenants)'],['properties','Properties'],['leases','Leases'],['meters','Common meter buildings'],['staff','Staff']];
async function downloadBackup(){
  toast('⏳ Preparing backup…',3000);
  try{ await _hydrateImages(); }catch(e){}            // make sure every photo / stamp paper is included
  try{ await _idPrefetch(S.parties||[]); }catch(e){}   // and every ID picture
  const counts={}; _BK_KINDS.forEach(([k])=>counts[k]=(S[k]||[]).length);
  const files={}; let idMissing=0;
  for(const l of (S.leases||[]))for(const a of Object.values(l.signed||{}))for(const f of (a||[])){ try{ await _idGet(f); }catch(e){} }
  (S.parties||[]).forEach(p=>Object.values(p.ids||{}).forEach(a=>(a||[]).forEach(f=>{ if(_IDF[f.ref])files[f.ref]=_IDF[f.ref]; else idMissing++; })));
  (S.leases||[]).forEach(l=>Object.values(l.signed||{}).forEach(a=>(a||[]).forEach(f=>{ if(_IDF[f.ref])files[f.ref]=_IDF[f.ref]; else idMissing++; })));
  const missing=JSON.stringify(S).split('"@img:').length-1+idMissing;
  const payload={app:'LeaseDesk',version:1,exportedAt:new Date().toISOString(),exportedBy:user||'',counts,data:S,files};
  const name='leasedesk-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  try{ localStorage.setItem('leasdesk_last_backup',new Date().toISOString()); }catch(e){}
  actLog('Downloaded full backup');
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/android|iphone|ipad/i.test(navigator.userAgent)){
    try{ await navigator.share({files:[file],title:name}); toast('✅ Backup ready'); renderSettings(); return; }catch(e){ if(e&&e.name==='AbortError'){ renderSettings(); return; } }
  }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(missing?`⚠️ Backup saved, but ${missing} photo(s) couldn't be loaded — check internet and download again`:'📥 Backup downloaded: '+name,5000);
  renderSettings();
}
let _restoreData=null;
function openRestore(){
  _restoreData=null;
  openM('📤 Restore from Backup',`
    <div style="font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:10px;">Pick a LeaseDesk backup file. You'll see what's inside before anything changes.<br/><b>Tip:</b> download a fresh backup first, so you can undo a restore.</div>
    <input type="file" accept=".json,application/json" class="finput" onchange="_restorePicked(this)"/>
    <div id="rsInfo" style="margin-top:12px;"></div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button>`);
}
function _restorePicked(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const box=document.getElementById('rsInfo'); box.innerHTML='<div style="font-size:12px;color:var(--muted);">Reading file…</div>';
  const r=new FileReader();
  r.onload=e=>{
    let d; try{ d=JSON.parse(e.target.result); }catch(_){ box.innerHTML='<div style="color:var(--red);font-size:12px;">This is not a valid backup file.</div>'; return; }
    if(!d||d.app!=='LeaseDesk'||!d.data||typeof d.data!=='object'){ box.innerHTML='<div style="color:var(--red);font-size:12px;">This file is not a LeaseDesk backup.</div>'; return; }
    _restoreData=d;
    const rows=_BK_KINDS.map(([k,lab])=>`<tr><td>${lab}</td><td>${(d.data[k]||[]).length}</td><td>${(S[k]||[]).length}</td></tr>`).join('');
    const ids=k=>new Set((S[k]||[]).map(x=>x.id));
    const newCount=_BK_KINDS.reduce((n,[k])=>n+(d.data[k]||[]).filter(x=>x&&x.id&&!ids(k).has(x.id)).length,0);
    box.innerHTML=`<div style="font-size:12px;margin-bottom:8px;">Backup from <b>${new Date(d.exportedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</b>${d.exportedBy?' by '+_h(d.exportedBy):''}</div>
      <table class="tbl" style="margin-bottom:12px;"><thead><tr><th>Records</th><th>In backup</th><th>In app now</th></tr></thead><tbody>${rows}</tbody></table>
      <button class="btn btn-blue" style="width:100%;margin-bottom:6px;" onclick="_doRestore('merge')">➕ Merge — only bring back missing records (${newCount})</button>
      <div style="font-size:11px;color:var(--muted);margin:0 2px 12px;">Keeps everything in the app as it is and adds records from the backup that aren't in the app.</div>
      <button class="btn btn-red" style="width:100%;margin-bottom:6px;" onclick="_doRestore('replace')">↺ Replace — make the app match this backup</button>
      <div style="font-size:11px;color:var(--muted);margin:0 2px;">Anything added or changed after this backup will be removed.</div>`;
  };
  r.readAsText(f);
}
async function _restoreIdFiles(files){
  const refs=Object.keys(files||{}); let n=0;
  for(const ref of refs){ try{ const data=files[ref]; await _putImg({key:ref,data,n:Math.ceil(data.length/IMG_CHUNK)}); _IDF[ref]=data; n++; }catch(e){ console.error(e); } }
  if(refs.length)toast(n===refs.length?'✅ '+n+' ID pictures restored':'⚠️ '+(refs.length-n)+' ID pictures could not be restored — try again',5000);
}
function _doRestore(mode){
  const d=_restoreData; if(!d)return;
  if(!confirm(mode==='replace'?'Replace ALL current LeaseDesk data with this backup?\n\nAnything added after the backup will be removed for everyone.':'Add the records from this backup that are missing in the app?'))return;
  if(d.files)setTimeout(()=>_restoreIdFiles(d.files),300);
  const src=JSON.parse(JSON.stringify(d.data));
  if(mode==='replace'){
    const keepLog=S.activityLog||[];
    S={...S,...src}; S.activityLog=keepLog;
  } else {
    _BK_KINDS.forEach(([k])=>{
      if(!S[k])S[k]=[];
      const have=new Set(S[k].map(x=>x.id));
      (src[k]||[]).forEach(x=>{ if(x&&x.id&&!have.has(x.id))S[k].push(x); });
    });
    if(src.ptSets){ S.ptSets={...(src.ptSets||{}),...(S.ptSets||{})}; }
  }
  ['parties','properties','leases','staff','activityLog'].forEach(k=>{ if(!S[k])S[k]=[]; });
  actLog((mode==='replace'?'Restored backup (replace) from ':'Merged backup from ')+(d.exportedAt||'').slice(0,10));
  save(); closeM(); renderTab(); toast(mode==='replace'?'↺ Restored from backup':'➕ Missing records brought back',4000);
}

  <div class="card" style="margin-bottom:14px;">

function saveStaff(){
  const name=document.getElementById('staffName').value.trim();
  const pass=document.getElementById('staffPass').value;
  const role=document.getElementById('staffRole').value;
  if(!name||!pass){toast('❌ Name and password required');return;}
  if(HARD_USERS.find(u=>u.password===pass)||(S.staff||[]).find(u=>u.password===pass)){toast('❌ Password already in use');return;}
  if(!S.staff)S.staff=[];
  S.staff.push({id:uid(),name,password:pass,role,createdAt:today(),createdBy:user});
  actLog('Added staff — '+name+' ('+role+')');
  sched();closeM();renderSettings();toast('✅ Staff added');
}

function removeStaff(id){
  if(!confirm('Remove this staff member?'))return;
  const s=(S.staff||[]).find(x=>x.id===id);
  actLog('Removed staff — '+(s?.name||id));
  S.staff=(S.staff||[]).filter(x=>x.id!==id);
  sched();renderSettings();toast('🗑 Removed');
}

function clearLog(){
  if(!confirm('Clear all activity log entries?'))return;
  S.activityLog=[];sched();renderSettings();toast('🗑 Log cleared');
}

});
