<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>LeaseDesk — KD Constructions</title>
<link rel="manifest" href="leasedesk-manifest.json"/>
<meta name="theme-color" content="#E8711A"/>
<link rel="icon" type="image/png" sizes="32x32" href="leasedesk-favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="leasedesk-icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="LeaseDesk"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F4F3EF;--white:#FFFFFF;--card:#FAFAF8;
  --ink:#1A1A18;--ink2:#4A4A44;--muted:#9A9A90;
  --border:#E4E3DB;--border2:#D4D3C8;
  --orange:#E8711A;--orange-dim:#FEF3E8;--orange-mid:#F5A55A;
  --green:#2D9E5F;--green-dim:#EDFAF3;
  --red:#D94040;--red-dim:#FEEFEF;
  --blue:#2563EB;--blue-dim:#EFF4FF;
  --amber:#D97706;--amber-dim:#FFFBEB;
  --purple:#7C3AED;--purple-dim:#F5F3FF;
  --teal:#0D9488;--teal-dim:#F0FDFA;
  --nav-h:110px;--top-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden;}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1A1A18 0%,#2D2D28 60%,#3A2810 100%);padding:24px;}
.login-box{background:var(--white);border-radius:20px;padding:36px 28px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,0.4);}
.login-logo{font-family:'Lora',serif;font-size:26px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.login-logo span{color:var(--orange);}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:28px;}
.login-label{font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:block;}
.login-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);outline:none;transition:border .2s;}
.login-input:focus{border-color:var(--orange);}
.login-btn{width:100%;margin-top:20px;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.3px;}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none;text-align:center;}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;height:100vh;height:100dvh;}
.topbar{height:var(--top-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.top-logo{font-family:'Lora',serif;font-size:18px;font-weight:600;color:var(--ink);}
.top-logo span{color:var(--orange);}
.top-right{display:flex;align-items:center;gap:10px;}
.top-user{font-size:12px;color:var(--muted);font-weight:500;}
.top-role{font-size:10px;background:var(--orange-dim);color:var(--orange);padding:2px 8px;border-radius:10px;font-weight:700;}
.top-logout{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ink2);font-family:inherit;cursor:pointer;}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(var(--nav-h) + 16px);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;flex-wrap:wrap;height:var(--nav-h);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,0.07);}
.bn-item{width:25%;height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;font-family:inherit;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .15s;}
.bn-item:nth-child(3n){border-right:none;}
.bn-item:nth-child(n+7){border-bottom:none;}
.bn-item.active{background:var(--orange-dim);}
.bn-item.active .bn-icon{filter:none;}
.bn-item.active .bn-label{color:var(--orange);}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.2px;}
.bn-item.active .bn-label{color:var(--orange);}

/* ── CARDS & STATS ── */
.card{background:var(--white);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
.card-title{font-size:13px;font-weight:700;color:var(--ink);}
.card-body{padding:14px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
.stat{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:3px;}
.stat-icon{font-size:20px;line-height:1;margin-bottom:2px;}
.stat-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;line-height:1;}
.stat-sub{font-size:10px;color:var(--muted);}
.ora{color:var(--orange);} .grn{color:var(--green);} .red{color:var(--red);} .blu{color:var(--blue);} .amb{color:var(--amber);}

/* ── TABLES ── */
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.btn:active{opacity:.8;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-purple{background:var(--purple);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-ghost{background:var(--bg);color:var(--ink2);border:1px solid var(--border);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-xs{padding:3px 7px;font-size:10px;}
.btn-lg{padding:11px 20px;font-size:14px;border-radius:10px;}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.badge-grn{background:var(--green-dim);color:var(--green);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-amb{background:var(--amber-dim);color:var(--amber);}
.badge-blu{background:var(--blue-dim);color:var(--blue);}
.badge-ora{background:var(--orange-dim);color:var(--orange);}
.badge-pur{background:var(--purple-dim);color:var(--purple);}
.badge-tel{background:var(--teal-dim);color:var(--teal);}

/* ── FORMS ── */
.flabel{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:5px;letter-spacing:.3px;}
.finput,.fselect,.ftextarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--white);outline:none;transition:border .2s;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--orange);}
.ftextarea{min-height:80px;resize:vertical;}
.frow1{margin-bottom:12px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.irow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.irow:last-child{border-bottom:none;}
.irow-label{font-size:12px;color:var(--ink2);}
.irow-value{font-size:12px;font-weight:600;color:var(--ink);}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--white);border-radius:18px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-size:15px;font-weight:700;color:var(--ink);}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}

/* ── LEASE OVERLAY ── */
#leaseOverlay{display:none;position:fixed;inset:0;z-index:150;background:var(--bg);flex-direction:column;}
#leaseOverlay.open{display:flex;}
.lo-head{height:var(--top-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;}
.lo-title{font-family:'Lora',serif;font-size:16px;font-weight:600;flex:1;}
.lo-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0;}
.lo-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--white);flex-shrink:0;overflow-x:auto;}
.lo-tab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;font-family:inherit;}
.lo-tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.lo-panel{display:none;padding:14px;overflow-y:auto;}
.lo-panel.active{display:block;}
.lo-preview{font-family:'Lora',serif;font-size:13px;line-height:1.8;color:var(--ink);padding:20px;background:var(--white);border:1px solid var(--border);border-radius:10px;margin-top:14px;}

/* ── DEED WRAP ── */
/* lease points editor */
.pt-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--white);margin-bottom:6px;}
.pt-row.pt-editing{display:block;border-color:var(--orange);}
.pt-row.pt-removed .pt-txt{text-decoration:line-through;color:var(--muted);}
.pt-txt{font-size:12px;line-height:1.5;color:var(--ink);flex:1;min-width:0;}
.pt-btns{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.pt-tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-right:5px;color:#fff;text-decoration:none;vertical-align:1px;}
.pt-tag.red{background:var(--red);} .pt-tag.blue{background:var(--blue);} .pt-tag.orange{background:var(--orange);}
.pt-tags{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.9;} .pt-tags code{background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10.5px;cursor:pointer;white-space:nowrap;}
.pt-foot{font-size:11px;color:var(--muted);margin-top:8px;padding:10px;background:var(--bg);border-radius:8px;}
.deed-wrap{font-family:'Lora',serif;font-size:13px;line-height:1.8;color:#111;max-width:680px;margin:0 auto;}
.deed-wrap h2{font-size:16px;font-weight:700;text-align:center;text-decoration:underline;letter-spacing:1.5px;margin-bottom:8px;}
.deed-wrap h3{font-size:13px;font-weight:700;text-align:center;margin-bottom:16px;}
.deed-wrap p{text-align:justify;margin-bottom:10px;}
.deed-wrap ol{margin:0;padding-left:0;list-style:none;}
.deed-wrap ol li{margin-bottom:10px;text-align:justify;}
.deed-cl{font-weight:700;text-decoration:underline;}
.deed-pg{page-break-before:always;padding-top:24px;}
.deed-sig{display:flex;width:100%;margin-top:48px;gap:0;}
.deed-sig-blk{flex:1;text-align:center;border-top:1px solid #333;padding-top:8px;font-size:11px;}
.deed-wit{display:flex;width:100%;margin-bottom:32px;margin-top:20px;}
.deed-wit-blk{flex:1;border-top:1px solid #333;padding-top:6px;font-size:11px;min-height:70px;}
.deed-id-page{page-break-before:always;padding-top:20px;}
.deed-id-page h4{font-size:14px;font-weight:700;margin-bottom:16px;text-decoration:underline;}
.deed-id-img{max-width:100%;margin-bottom:12px;border:1px solid #ddd;border-radius:4px;display:block;}
.deed-id-grid{display:table;width:100%;}
.deed-id-cell{display:table-cell;width:50%;vertical-align:top;padding:0 8px 12px 0;}
.deed-id-cell img{max-width:100%;max-height:150px;display:block;border:1px solid #ddd;margin-top:4px;border-radius:3px;}
.inv-table{width:100%;border-collapse:collapse;margin-top:12px;}
.inv-table th,.inv-table td{border:1px solid #333;padding:6px 10px;font-size:12px;text-align:left;}
.inv-table th{background:#f0f0f0;font-weight:700;}
.renewal-banner{background:var(--blue-dim);border:1.5px solid var(--blue);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--blue);font-weight:600;}

/* ── CHECKLIST ── */
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.cl-item:last-child{border-bottom:none;}
.cl-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);appearance:none;-webkit-appearance:none;cursor:pointer;flex-shrink:0;transition:all .2s;position:relative;}
.cl-check:checked{background:var(--green);border-color:var(--green);}
.cl-check:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:12px;font-weight:700;}
.cl-label{flex:1;font-size:13px;color:var(--ink2);}
.cl-meta{font-size:10px;color:var(--muted);}
.cl-progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px;}
.cl-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s;}

/* ── UPLOAD ── */
.upload-box{border:2px dashed var(--border2);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:border .2s;background:var(--bg);}
.upload-box:hover{border-color:var(--orange);}
.upload-thumb{width:100%;max-height:120px;object-fit:contain;border-radius:6px;margin-top:8px;}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{color:var(--muted);font-size:13px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);background:#1A1A18;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}

/* ── PRINT ── */
#printZone{display:none;}
.print-btn-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--orange-dim);border-bottom:1px solid var(--border);}
@media print{
  body>*{display:none!important;}
  #printZone{display:block!important;}
  #printZone .deed-wrap{font-family:"Times New Roman",Times,serif!important;font-size:14.5px!important;line-height:1.84!important;color:#111!important;max-width:none!important;width:100%!important;text-align:justify!important;}
  #printZone .deed-wrap h2{font-size:16px!important;text-align:center!important;}
  #printZone .deed-wrap h3{font-size:14px!important;text-align:center!important;}
  #printZone .deed-wrap p{text-align:justify!important;margin-bottom:10px!important;orphans:3;widows:3;}
  #printZone .deed-wrap ol li{text-align:justify!important;margin-bottom:10px!important;orphans:3;widows:3;}
  #printZone .deed-witness-section{page-break-inside:avoid!important;break-inside:avoid!important;margin-top:22px!important;}
  #printZone .deed-wit{margin-top:34px!important;margin-bottom:20px!important;}
  #printZone .deed-wit-blk{min-height:115px!important;padding-bottom:45px!important;display:table-cell!important;width:50%!important;}
  #printZone .deed-sig{display:table!important;table-layout:fixed!important;width:100%!important;margin-top:28px!important;page-break-inside:avoid!important;break-inside:avoid!important;}
  #printZone .deed-sig-blk{display:table-cell!important;width:50%!important;text-align:center!important;border-top:1px solid #333!important;padding-top:8px!important;}
  #printZone .deed-wit{display:table!important;table-layout:fixed!important;width:100%!important;}
  #printZone .deed-id-img{max-width:60%!important;max-height:200px!important;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  html{-webkit-text-size-adjust:100%;}
  @page{
    size:A4 portrait;
    margin:18mm 18mm 22mm 18mm;
  }
}
</style>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Lease<span>Desk</span></div>
    <div class="login-sub">KD Constructions · Lease Management</div>
    <label class="login-label">Who are you?</label>
    <div id="lWho" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;"></div>
    <label class="login-label">Password</label>
    <input class="login-input" type="password" id="lPass" placeholder="Enter your password" autocomplete="current-password" autocapitalize="off" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <div class="login-err" id="lErr">Incorrect password. Try again.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="top-logo">Lease<span>Desk</span></div>
    <div class="top-right">
      <span class="top-user" id="tbUser"></span>
      <span class="top-role" id="tbRole"></span>
      <button class="top-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="content" id="mc"></div>
  <div class="bottom-nav">
    <button class="bn-item active" id="bn-dash" onclick="goTab('dash')"><span class="bn-icon">📊</span><span class="bn-label">Dashboard</span></button>
    <button class="bn-item" id="bn-parties" onclick="goTab('parties')"><span class="bn-icon">👥</span><span class="bn-label">Parties</span></button>
    <button class="bn-item" id="bn-props" onclick="goTab('props')"><span class="bn-icon">🏢</span><span class="bn-label">Properties</span></button>
    <button class="bn-item" id="bn-leases" onclick="goTab('leases')"><span class="bn-icon">📄</span><span class="bn-label">Leases</span></button>
    <button class="bn-item" id="bn-meters" onclick="goTab('meters')"><span class="bn-icon">⚡</span><span class="bn-label">Meter</span></button>
    <button class="bn-item" id="bn-calc" onclick="goTab('calc')"><span class="bn-icon">🧮</span><span class="bn-label">Calculator</span></button>
    <button class="bn-item" id="bn-bylaws" onclick="goTab('bylaws')"><span class="bn-icon">📚</span><span class="bn-label">Bylaws</span></button>
    <button class="bn-item" id="bn-settings" onclick="goTab('settings')"><span class="bn-icon">⚙️</span><span class="bn-label">Settings</span></button>
  </div>
</div>

<!-- LEASE OVERLAY -->
<div id="leaseOverlay">
  <div class="lo-head">
    <button class="btn btn-ghost btn-sm" onclick="closeLease()">← Back</button>
    <div class="lo-title" id="loTitle">New Lease</div>
    <button class="btn btn-orange btn-sm" onclick="saveLease()">💾 Save</button>
  </div>
  <div class="print-btn-bar" id="loPrintBar">
    <button class="btn btn-blue btn-sm" id="loPrintBtn" onclick="printLeaseDeed()">🖨️ Print / PDF</button>
    <button class="btn btn-ghost btn-sm" id="loWordBtn" onclick="downloadLeaseWord()" title="Editable Word copy to share">📝 Word</button>
    <button class="btn btn-green btn-sm" onclick="shareLeaseWA()">📤 WhatsApp</button>
  </div>
  <div class="lo-tabs">
    <button class="lo-tab active" onclick="showLoTab('form')">📝 Details</button>
    <button class="lo-tab" onclick="showLoTab('clauses')">📋 Points</button>

function toFS(obj){
  function fv(v){
    if(v===null||v===undefined)return{nullValue:null};
    if(typeof v==='boolean')return{booleanValue:v};
    if(typeof v==='number')return{doubleValue:v};
    if(typeof v==='string')return{stringValue:v};
    if(Array.isArray(v))return{arrayValue:{values:v.map(fv)}};
    if(typeof v==='object')return{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,val])=>[k,fv(val)]))}};
    return{stringValue:String(v)};
  }
  return{fields:Object.fromEntries(Object.entries(obj).map(([k,v])=>[k,fv(v)]))};
}
function fromFS(fields){
  if(!fields)return{};
  function fv(v){
    if('nullValue'in v)return null;
    if('booleanValue'in v)return v.booleanValue;
    if('doubleValue'in v)return v.doubleValue;
    if('integerValue'in v)return Number(v.integerValue);
    if('stringValue'in v)return v.stringValue;
    if('arrayValue'in v)return(v.arrayValue.values||[]).map(fv);
    if('mapValue'in v)return fromFS(v.mapValue.fields);
    return null;
  }
  return Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,fv(v)]));
}

    const own=v.id?String(v.id):owner, base=v.id?'':path, out={};
    Object.keys(v).forEach(k=>{ out[k]=_externalize(v[k],own,base?base+'_'+k:k,jobs); });

// Tries sharper settings first and steps down until the image is small enough; still clear on A4.
const STAMP_TARGET=450000;
function _shrinkCanvas(src,target){
  const tries=[[1700,0.8],[1500,0.78],[1400,0.72],[1250,0.68],[1100,0.62],[1000,0.55]];
  let out='';
  for(const [w,q] of tries){
    const sc=Math.min(1,w/(src.width||w)), c=document.createElement('canvas');
    c.width=Math.round((src.width||w)*sc); c.height=Math.round((src.height||w)*sc);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(src,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q);
    if(out.length<=(target||STAMP_TARGET))break;
  }
  return out;
}

// ══════════════════════════════════════════════════════════════════
// 🔄 SHARED DATA — KD and Baljot (and staff) can work at the same time from different places.
// The app remembers the last copy it got from the cloud ("base"). Before every save it fetches the cloud again
// and combines record by record (parties, properties, leases, meters, staff):
//   • changed or added on this phone → this phone's version
//   • deleted on this phone → deleted
//   • not touched here → whatever is in the cloud now (so the other person's adds, edits and deletes come through)
// The save is only accepted if nobody saved in between (otherwise it combines again).
// The app also checks the cloud every 20 seconds and whenever it comes back on screen.
// ══════════════════════════════════════════════════════════════════
const SYNC_COLS=['parties','properties','leases','meters','staff'];
const _SKIP_TOP=new Set(['_lc','_savedAt','activityLog',...SYNC_COLS]);
let _sync={ready:false,recs:{},top:{},updateTime:''};
let _needRender=false, _pulling=false;
function _canon(v){
  if(v===null||v===undefined)return null;
  if(Array.isArray(v))return v.map(_canon);
  if(typeof v==='object'){ const o={}; Object.keys(v).sort().forEach(k=>{ const c=_canon(v[k]); if(c!==null)o[k]=c; }); return o; }
  return v;
}
function _cj(v){ return JSON.stringify(_canon(v)); }
function _slimJ(rec){ return _cj(_externalize(rec,'s','x',[])); }
function _setBase(remote,updateTime){
  const recs={}, top={};
  SYNC_COLS.forEach(col=>(remote[col]||[]).forEach(r=>{ if(r&&r.id)recs[col+':'+r.id]=_cj(r); }));
  Object.keys(remote).forEach(k=>{ if(!_SKIP_TOP.has(k))top[k]=_cj(remote[k]); });
  _sync={ready:true,recs,top,updateTime:updateTime||''};
}
function _logKey(e){ return (e&&e.ts||'')+'|'+(e&&e.user||'')+'|'+(e&&e.action||''); }
function _logTime(e){ const m=String(e&&e.ts||'').match(/(\d+)\/(\d+)\/(\d+) (\d+):(\d+)/); return m?Date.UTC(+m[3],m[2]-1,+m[1],+m[4],+m[5]):0; }
// combine the cloud copy (remote, as stored) with what is on this phone → {data, pendingHere, changedThere}
function _combine(remote){
  const out={...S}; let pendingHere=false, changedThere=false;
  SYNC_COLS.forEach(col=>{
    const L=(S[col]||[]).filter(r=>r&&r.id), R=(remote[col]||[]).filter(r=>r&&r.id);
    const lMap=new Map(L.map(r=>[r.id,r])), rMap=new Map(R.map(r=>[r.id,r]));
    const ids=[...R.map(r=>r.id),...L.filter(r=>!rMap.has(r.id)).map(r=>r.id)], res=[];
    ids.forEach(id=>{
      const b=_sync.recs[col+':'+id], l=lMap.get(id), r=rMap.get(id);
      const lj=l?_slimJ(l):undefined, rj=r?_cj(r):undefined;
      if(!l){ if(b!==undefined){ pendingHere=true; return; }            // deleted on this phone
              res.push(r); changedThere=true; return; }                 // added by someone else
      if(!r){ if(b!==undefined&&lj===b){ changedThere=true; return; }   // deleted by someone else
              res.push(l); pendingHere=true; return; }                  // added on this phone (or edited here while deleted there)
      if(lj!==b){                                                       // changed on this phone
        if(b!==undefined&&rj!==b){                                      // …and by someone else too: keep both, field by field
          const bo=JSON.parse(b), ls=_externalize(l,'s','x',[]), m={...r};
          new Set([...Object.keys(ls),...Object.keys(bo)]).forEach(k=>{ if(_cj(ls[k])!==_cj(bo[k])){ if(k in l)m[k]=l[k]; else delete m[k]; } });
          res.push(m); changedThere=true; pendingHere=true; return; }
        res.push(l); if(lj!==rj)pendingHere=true; return; }
      if(rj!==lj){ res.push(r); changedThere=true; return; }            // changed by someone else
      res.push(l);                                                      // same everywhere
    });
    out[col]=res;
  });
  // settings & other single values: this phone's value if it changed here, otherwise the cloud's
  new Set([...Object.keys(remote),...Object.keys(S)]).forEach(k=>{
    if(_SKIP_TOP.has(k))return;
    const lj=_cj(_externalize(S[k],'s',k,[])), rj=_cj(remote[k]), b=_sync.top[k];
    if(lj!==b){ if(lj!==rj)pendingHere=true; out[k]=S[k]; }
    else if(rj!==lj){ out[k]=remote[k]; changedThere=true; }
  });
  // activity log: everyone's entries, newest first
  const seen=new Set(), log=[];
  [...(S.activityLog||[]),...(remote.activityLog||[])].forEach(e=>{ const k=_logKey(e); if(!seen.has(k)){ seen.add(k); log.push(e); } });
  log.sort((a,b)=>_logTime(b)-_logTime(a));
  out.activityLog=log.slice(0,200);
  const rk=new Set((remote.activityLog||[]).map(_logKey)), lk=new Set((S.activityLog||[]).map(_logKey));
  if(out.activityLog.some(e=>!rk.has(_logKey(e))))pendingHere=true;
  if(out.activityLog.some(e=>!lk.has(_logKey(e))))changedThere=true;
  return {data:out,pendingHere,changedThere};
}
function _applyCombined(data){
  Object.keys(data).forEach(k=>{ S[k]=data[k]; });
  ['parties','properties','leases','staff','activityLog'].forEach(k=>{ if(!S[k])S[k]=[]; });
}
async function _fetchCloud(){
  const r=await fetch(`${FB_URL}?key=${FB_KEY}`);
  if(r.status===404)return {remote:{},updateTime:''};
  if(!r.ok)throw new Error('could not read the cloud ('+r.status+')');
  const d=await r.json(); return {remote:fromFS(d.fields||{}),updateTime:d.updateTime||''};
}
function _somethingOpen(){
  return document.getElementById('modalBg').classList.contains('open')||document.getElementById('leaseOverlay').classList.contains('open')||!!(document.getElementById('idViewer')&&document.getElementById('idViewer').style.display==='flex');
}
function _renderAfterSync(){ if(_somethingOpen()){ _needRender=true; return; } _needRender=false; try{renderTab();}catch(e){} }
// pull the cloud and combine (no save unless this phone has changes waiting)
async function syncPull(why){
  if(!_sync.ready||_pulling||_saving||saveT||!user)return;
  _pulling=true;
  try{
    const {remote,updateTime}=await _fetchCloud();
    if(updateTime&&updateTime===_sync.updateTime){ _pulling=false; return; }
    if(_saving||saveT){ _pulling=false; return; }                         // a save started meanwhile — it will combine
    const c=_combine(remote);
    _applyCombined(c.data); _setBase(remote,updateTime);
    if(c.changedThere){ _renderAfterSync(); if(JSON.stringify(remote).indexOf('"@img:')>=0)_hydrateImages(); }
    if(c.pendingHere)sched();
  }catch(e){ console.warn('sync',why,e); }
  _pulling=false;
}
setInterval(()=>{ if(!document.hidden)syncPull('timer'); },20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)setTimeout(()=>syncPull('back on screen'),300); });
window.addEventListener('focus',()=>setTimeout(()=>syncPull('focus'),300));
window.addEventListener('online',()=>setTimeout(()=>syncPull('online'),1000));
// a phone that had records the cloud no longer has (from before this fix) — offer to bring them back
function _offerRecovery(localSlim){
  if(!localSlim)return;
  const lost=[];
  ['leases','parties','properties','meters'].forEach(col=>{
    const have=new Set((S[col]||[]).map(r=>r.id));
    (localSlim[col]||[]).forEach(r=>{ if(r&&r.id&&!have.has(r.id))lost.push({col,r}); });
  });
  if(!lost.length)return;
  window._lostRecs=lost;
  const name=x=>x.col==='leases'?'Lease — '+((x.r.tenantNames&&x.r.tenantNames.join(', '))||x.r.tenantName||'')+(x.r.startDate?' from '+fd(x.r.startDate):''):x.col==='parties'?(x.r.type==='landlord'?'Landlord — ':'Tenant — ')+(x.r.firmName?'M/s '+x.r.firmName:x.r.name||''):x.col==='properties'?'Property — '+(x.r.name||x.r.address||''):'Meter — '+(x.r.name||'');
  openM('↩ Records only on this phone',`<div style="font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:10px;">This phone still has <b>${lost.length}</b> record${lost.length>1?'s':''} that ${lost.length>1?'are':'is'} not in the shared data any more — most likely overwritten when two people saved at the same time (the problem that is now fixed). If one was deleted on purpose, untick it.</div>
    ${lost.map((x,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);"><input type="checkbox" class="lostCk" data-i="${i}" checked style="margin-top:3px;"/> <span>${_h(name(x))}</span></label>`).join('')}`,
    `<button class="btn btn-ghost" onclick="_dismissLost()">Not needed</button><button class="btn btn-orange" onclick="_restoreLost()">↩ Bring back selected</button>`);
}
function _restoreLost(){
  const lost=window._lostRecs||[], pick=[...document.querySelectorAll('.lostCk')].filter(c=>c.checked).map(c=>lost[+c.dataset.i]);
  pick.forEach(x=>{ if(!S[x.col])S[x.col]=[]; if(!S[x.col].some(r=>r.id===x.r.id))S[x.col].push(JSON.parse(JSON.stringify(x.r))); });
  if(pick.length){ actLog('Brought back '+pick.length+' record(s) that were only on this phone'); sched(); _hydrateImages(); }
  _dismissLost(); toast(pick.length?'✅ '+pick.length+' brought back and shared':'Nothing brought back');
}
function _dismissLost(){ window._lostRecs=null; try{ const l=JSON.parse(localStorage.getItem('leasdesk_local')||'null'); if(l){ l.S=null; l.checked=true; localStorage.setItem('leasdesk_local',JSON.stringify(l)); } }catch(e){} closeM(); renderTab(); }

async function save(){
  saveT=null;
  if(_saving){ _saveAgain=true; return; }
  _saving=true; _lc++; const lc=_lc;
  try{ await _shrinkBigStamps(); }catch(e){}
  _localBackup(_externalize(S,'s','',[]),true);
  try{
    if(!_sync.ready)throw new Error('the shared data has not loaded yet — will try again');
    let done=false;
    for(let attempt=0;attempt<4&&!done;attempt++){
      const {remote,updateTime}=await _fetchCloud();
      const c=_combine(remote);
      _applyCombined(c.data); _setBase(remote,updateTime);              // the cloud copy is now part of this phone's data
      const jobs=[]; const slim=_externalize(S,'s','',jobs);
      for(const job of jobs){ const sig=_imgSig(job.data); if(_imgDone[job.key]!==sig){ await _putImg(job); _imgDone[job.key]=sig; } }
      const body=JSON.stringify({fields:{...toFS(slim).fields,_lc:{integerValue:String(lc)},_savedAt:{stringValue:new Date().toISOString()}}});
      const pre=updateTime?'&currentDocument.updateTime='+encodeURIComponent(updateTime):'';
      const r=await fetch(`${FB_URL}?key=${FB_KEY}${pre}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
      if(r.status===400||r.status===409||r.status===412){ const t=await r.text(); if(/FAILED_PRECONDITION|precondition|ABORTED/i.test(t)){ _setBase(remote,updateTime); continue; } throw new Error('cloud refused the save ('+r.status+') '+t.slice(0,160)); }
      if(!r.ok)throw new Error('cloud refused the save ('+r.status+') '+(await r.text()).slice(0,160));
      const saved=await r.json().catch(()=>null);
      _setBase(JSON.parse(JSON.stringify(slim)),(saved&&saved.updateTime)||'');
      _localBackup(slim,false); _saveBanner(true); done=true;
      if(c.changedThere)_renderAfterSync();
    }
    if(!done)throw new Error('someone else kept saving at the same moment — will try again');
  }catch(e){ console.error('Save error',e); _saveBanner(false,e.message); if(!saveT)saveT=setTimeout(save,15000); }
  _saving=false;
  if(_saveAgain){ _saveAgain=false; save(); }
}

async function loadData(){
  try{
    const r=await fetch(`${FB_URL}?key=${FB_KEY}`);
    if(r.status===404){ _setBase({},''); }
    if(!r.ok){renderTab();return;}
    const data=await r.json();
    const remote=fromFS(data.fields||{});
    let local=null; try{ local=JSON.parse(localStorage.getItem('leasdesk_local')||'null'); }catch(e){}
    if(local&&local.unsynced&&local.S&&local.base&&local.base.ready){
      // changes made on this phone that never reached the cloud: combine them with the latest cloud copy
      _sync=local.base; S={...S,...local.S};
      const c=_combine(remote); S={...S}; _applyCombined(c.data); _setBase(remote,data.updateTime);
      if(c.pendingHere)setTimeout(()=>{ toast('↩ Changes saved on this phone earlier are being shared now',4000); sched(); },600);
    } else {
      S={...S,...remote}; _setBase(remote,data.updateTime);
      if(local&&local.S&&!local.checked&&!local.base)setTimeout(()=>_offerRecovery(local.S),1200);  // only backups from before this fix
    }
    if(!S.parties)S.parties=[];
    if(!S.properties)S.properties=[];
    if(!S.leases)S.leases=[];
    if(!S.staff)S.staff=[];
    if(!S.activityLog)S.activityLog=[];
  }catch(e){console.error('Load error',e);}
  _loadedOnce=true;
  renderTab();
  _hydrateImages();
}

// ── NAME PREFIXES (Mr. / Mrs. / Ms. / M/s …) ──
// Stored in front of the name ("Mr. Shirish Setia") so every deed and list prints it as chosen.
const NAME_PREFIXES=['Mr.','Mrs.','Ms.','M/s','Dr.','Sh.','Shri','Smt.','Late'];
function _splitPrefix(full){
  const str=String(full||'').trim();
  // a prefix counts only when followed by a dot or a space, so names like "Shirish" are left alone
  const m=str.match(/^(Mrs|Mr|Ms|M\/s|Dr|Shri|Smt|Sh|Late)(?:\.\s*|\s+)(.*)$/i);
  if(!m)return{prefix:'',rest:str};
  const k=m[1].toLowerCase(), map={mr:'Mr.',mrs:'Mrs.',ms:'Ms.','m/s':'M/s',dr:'Dr.',sh:'Sh.',shri:'Shri',smt:'Smt.',late:'Late'};
  return{prefix:map[k]||'',rest:m[2].trim()};
}
function _prefixSelect(id,cur,optional){
  return `<select class="fselect" id="${id}" style="width:auto;min-width:74px;flex:0 0 auto;">`
    +`<option value="" ${!cur?'selected':''}>${optional?'—':'—'}</option>`
    +NAME_PREFIXES.map(x=>`<option value="${x}" ${cur===x?'selected':''}>${x}</option>`).join('')+`</select>`;
}
function _withPrefix(selId,inputId){
  const rest=_splitPrefix((document.getElementById(inputId)||{}).value||'').rest;
  const typed=_splitPrefix((document.getElementById(inputId)||{}).value||'').prefix;
  const pre=(document.getElementById(selId)||{}).value||typed;
  return rest?(pre?pre+' '+rest:rest):'';
}

var _panB64='',_aadhaarB64='';

async function previewImg(input,previewId,varName){
  const file=input.files[0];if(!file)return;
  try{
    const b64=await compressImage(file,800,0.75);
    window[varName]=b64;
    const img=document.getElementById(previewId);
    if(img){img.src=b64;img.style.display='block';}
  }catch(e){toast('❌ Error loading image');}
}

function compressImage(file,maxW=800,quality=0.75){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const ratio=Math.min(maxW/img.width,maxW/img.height,1);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*ratio;canvas.height=img.height*ratio;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=rej;img.src=e.target.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}

// ══════════════════════════════════════════════════════════════════
// 🪪 ID DOCUMENTS (one place per party — Parties tab; every lease uses them)
// party.ids = { aadhaar_f:[file], aadhaar_b:[file], pan:[file], photo:[file], passport:[file], coi:[file], board:[file], gst:[file], other:[file] }
// file = { ref, n, name, at, by, drive? }  — the picture itself is a separate cloud document (split in pieces),
// loaded only when it is shown / printed, so the app stays fast however many IDs are added.
// A PDF is turned into one picture per page when it is uploaded, so it prints inside the deed like a photo.
// ══════════════════════════════════════════════════════════════════
const ID_TYPES=[
  {key:'aadhaar_f',label:'Aadhaar — front',icon:'🪪',who:'all',req:true,print:true},
  {key:'aadhaar_b',label:'Aadhaar — back',icon:'🪪',who:'all',req:true,print:true},
  {key:'pan',label:'PAN card',icon:'💳',who:'all',req:true,print:true},
  {key:'photo',label:'Passport-size photo',icon:'🧑',who:'all',req:false,print:false},
  {key:'passport',label:'Passport / OCI card',icon:'🛂',who:'all',req:false,print:true,reqIf:p=>!!(p.oci||'').trim()},
  {key:'coi',label:'Incorporation certificate / partnership deed',icon:'🏢',who:'firm',req:false,print:true},
  {key:'board',label:'Board resolution / authority letter',icon:'📝',who:'firm',req:true,print:true},
  {key:'gst',label:'GST certificate',icon:'🧾',who:'firm',req:false,print:true},
  {key:'other',label:'Other ID / address proof (driving licence, bill…)',icon:'📄',who:'all',req:false,print:true},
];
const ID_FILE_TARGET=420000;           // ~300 KB a picture — sharp on an A4 print, small enough to load quickly
const ID_PDF_MAX_PAGES=6;
const _IDF={};                         // ref → picture (data URL), filled as pictures are loaded
let _idDraft={};                       // IDs added while a new party is being created (attached when it is saved)
let _idTarget=null;                    // {pid|'' (new party), key}
function _idTypesFor(p){ const firm=(p&&p.partyType)==='firm'; return ID_TYPES.filter(t=>t.who==='all'||(t.who==='firm'&&firm)); }
function _idLabel(t,p){ return (p&&p.partyType==='firm'&&['aadhaar_f','aadhaar_b','photo','passport'].includes(t.key))?t.label+' (of '+(p.repRole||'representative')+')':(p&&p.partyType==='firm'&&t.key==='pan'?'PAN card (of the firm)':t.label); }
function _idReq(t,p){ return !!(t.req||(t.reqIf&&t.reqIf(p||{}))); }
function _idFiles(p,key){ return ((p&&p.ids&&p.ids[key])||[]); }
function _idMissing(p){ return _idTypesFor(p).filter(t=>_idReq(t,p)&&!_idFiles(p,t.key).length); }
function _idCount(p){ return Object.values((p&&p.ids)||{}).reduce((a,x)=>a+(x||[]).length,0); }
function _partyById(id){ return (S.parties||[]).find(x=>x.id===id)||null; }
function _pDisp(p){ return p?(p.partyType==='firm'&&p.firmName?'M/s '+p.firmName:(p.name||'')):''; }

// ── cloud storage of the pictures (same pieces mechanism as the stamp papers) ──
async function _idPut(data){
  const ref='idf_'+uid(), n=Math.ceil(data.length/IMG_CHUNK);
  await _putImg({key:ref,data,n}); _IDF[ref]=data; return {ref,n};
}
async function _idGet(f){
  if(!f||!f.ref)return null; if(_IDF[f.ref])return _IDF[f.ref];
  try{ const d=await _getImg(f.ref,f.n||1); if(d)_IDF[f.ref]=d; return d; }catch(e){ return null; }
}
function _idDel(f){ if(!f||!f.ref)return; delete _IDF[f.ref]; for(let i=0;i<(f.n||1);i++){ fetch(`${FB_DOC_BASE}${f.ref}_${i}?key=${FB_KEY}`,{method:'DELETE'}).catch(()=>{}); } }
async function _idPrefetch(parties){
  const jobs=[]; (parties||[]).forEach(p=>{ if(!p)return; Object.values(p.ids||{}).forEach(arr=>(arr||[]).forEach(f=>{ if(!_IDF[f.ref])jobs.push(_idGet(f)); })); });
  if(jobs.length)await Promise.all(jobs); return jobs.length;
}
function _leaseParties(L){
  const ll=[L.landlordId,...(L.coLandlordIds||[])].filter(Boolean), tt=(L.tenantIds&&L.tenantIds.length?L.tenantIds:[L.tenantId]).filter(Boolean);
  return {landlords:ll.map(_partyById).filter(Boolean),tenants:tt.map(_partyById).filter(Boolean)};
}

// ── making the picture (photo or PDF page) ──
function _loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; resolve(); }; s.onerror=reject; document.head.appendChild(s); });
}
function _readDataUrl(file){ return new Promise((ok,bad)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=bad; r.readAsDataURL(file); }); }
function _imgFromDataUrl(src){ return new Promise((ok,bad)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=bad; im.src=src; }); }
async function _idPictures(file){                       // → [{data,name}]
  const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  const isImg=(file.type||'').startsWith('image/')||/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name);
  if(!isPdf&&!isImg)throw new Error(file.name+': please use a photo or a PDF');
  if(isPdf){
    if(file.size>25*1048576)throw new Error(file.name+' is over 25 MB');
    await _loadPdfJs();
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise, out=[];
    const pages=Math.min(pdf.numPages,ID_PDF_MAX_PAGES);
    for(let i=1;i<=pages;i++){
      const page=await pdf.getPage(i), base=page.getViewport({scale:1}), vp=page.getViewport({scale:Math.min(3,1800/Math.max(base.width,1))});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:g,viewport:vp}).promise;
      out.push({data:_shrinkCanvas(c,ID_FILE_TARGET),name:file.name.replace(/\.pdf$/i,'')+(pages>1?' – page '+i:'')});
    }
    if(pdf.numPages>ID_PDF_MAX_PAGES)toast('ℹ️ Only the first '+ID_PDF_MAX_PAGES+' pages of '+file.name+' were kept',5000);
    return out;
  }
  let im;
  try{ im=await _imgFromDataUrl(await _readDataUrl(file)); }
  catch(e){ throw new Error('Could not read '+file.name+' (iPhone HEIC? take a screenshot of it and upload that)'); }
  return [{data:_shrinkCanvas(im,ID_FILE_TARGET),name:file.name.replace(/\.(heic|heif|png|webp|jpe?g)$/i,'')}];
}

// ── upload ──
function idPick(pid,key){
  _idTarget={pid:pid||'',key};
  let inp=document.getElementById('idFileInput');
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='idFileInput'; inp.multiple=true; inp.accept='image/*,.pdf,application/pdf'; inp.style.display='none';
    inp.addEventListener('change',()=>_idUpload(inp)); document.body.appendChild(inp); }
  inp.value=''; inp.click();
}
async function _idUpload(inp){
  const tg=_idTarget, files=Array.from(inp.files||[]); if(!tg||!files.length)return;
  const t=ID_TYPES.find(x=>x.key===tg.key)||{label:tg.key};
  let done=0;
  for(const file of files){
    try{
      toast('⏳ Preparing '+file.name+'…',15000);
      const pics=await _idPictures(file);
      for(const pic of pics){
        toast('⏳ Uploading '+pic.name+'…',15000);
        const put=await _idPut(pic.data);
        const meta={ref:put.ref,n:put.n,name:pic.name,at:new Date().toISOString(),by:user||''};
        if(tg.pid){
          const p=_partyById(tg.pid); if(!p){ toast('❌ Party not found'); return; }
          if(!p.ids)p.ids={}; (p.ids[tg.key]||(p.ids[tg.key]=[])).push(meta);
          sched(); actLog('ID uploaded — '+t.label+' for '+_pDisp(p)); _driveQueue(p,tg.key,meta);
        } else (_idDraft[tg.key]||(_idDraft[tg.key]=[])).push(meta);
        done++;
      }
    }catch(e){ console.error(e); toast('❌ '+(e.message||('Could not upload '+file.name)),6000); }
  }
  if(done)toast('✅ '+done+' picture'+(done>1?'s':'')+' saved');
  _idRefreshAll();
}
async function idRemove(pid,key,i){
  if(!isAdmin){ toast('❌ Only admin can delete IDs'); return; }
  const p=pid?_partyById(pid):null, arr=p?_idFiles(p,key):(_idDraft[key]||[]), f=arr[i]; if(!f)return;
  if(!confirm('Delete "'+(f.name||'picture')+'"?'+(f.drive==='done'?'\n\n(The copy in Google Drive is kept.)':'')))return;
  arr.splice(i,1); _idDel(f);
  if(p){ actLog('ID deleted — '+key+' for '+_pDisp(p)); sched(); }
  _idRefreshAll();
}

// ── the ID list (party form, "🪪 IDs" window, lease ID tab) ──
function _idSlotsH(p,pid){
  const base=pid?_partyById(pid):null;
  const src=base?{...base,partyType:p.partyType||base.partyType,oci:p.oci!==undefined?p.oci:base.oci,repRole:p.repRole||base.repRole}:{...p,ids:_idDraft};
  const types=_idTypesFor(src||p), miss=_idMissing(src||p);
  const rows=types.map(t=>{
    const files=pid?_idFiles(src,t.key):(_idDraft[t.key]||[]);
    const req=_idReq(t,src||p);
    return `<div style="border:1px solid ${files.length?'rgba(45,158,95,.35)':req?'rgba(217,64,64,.3)':'var(--border)'};border-radius:10px;padding:8px 10px;margin-bottom:6px;background:${files.length?'var(--green-dim)':'var(--white)'};">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div style="font-size:12.5px;font-weight:600;min-width:0;">${files.length?'✅':req?'❌':'▫️'} ${t.icon} ${_h(_idLabel(t,src||p))}${req&&!files.length?' <span style="color:var(--red);font-size:10px;font-weight:700;">needed</span>':''}</div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          ${files.length?`<button type="button" class="btn btn-ghost btn-xs" onclick="idView('${pid||''}','${t.key}')">👁 View</button>`:''}
          <button type="button" class="btn ${files.length?'btn-ghost':'btn-orange'} btn-xs" onclick="idPick('${pid||''}','${t.key}')">${files.length?'➕ Add':'📤 Upload'}</button>
        </div>
      </div>
      ${files.length?`<div class="idthumbs" data-pid="${pid||''}" data-key="${t.key}" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">${files.map((f,i)=>`<div style="position:relative;width:64px;height:48px;border:1px solid var(--border);border-radius:6px;background:#fff;overflow:hidden;cursor:pointer;" onclick="idView('${pid||''}','${t.key}',${i})">
          <img data-ref="${f.ref}" ${_IDF[f.ref]?`src="${_IDF[f.ref]}"`:''} style="width:100%;height:100%;object-fit:cover;display:${_IDF[f.ref]?'block':'none'};"/>${_IDF[f.ref]?'':'<span style="font-size:9px;color:var(--muted);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">loading</span>'}
          ${isAdmin?`<button type="button" title="Delete" onclick="event.stopPropagation();idRemove('${pid||''}','${t.key}',${i})" style="position:absolute;top:1px;right:1px;border:0;background:rgba(217,64,64,.9);color:#fff;border-radius:4px;font-size:9px;line-height:1;padding:2px 4px;cursor:pointer;">✕</button>`:''}</div>`).join('')}</div>`:''}
    </div>`; }).join('');
  return `<div style="font-size:11px;color:var(--muted);margin:0 0 6px;">Photo or PDF · several files allowed (front & back, all pages) · printed as the last pages of every lease for this ${src&&src.type==='tenant'?'tenant':'party'}${!pid?' · saved with the party':''}</div>
    ${miss.length?`<div style="font-size:11.5px;color:var(--red);font-weight:600;margin-bottom:6px;">Still needed: ${miss.map(t=>_h(_idLabel(t,src||p))).join(', ')}</div>`:`<div style="font-size:11.5px;color:var(--green);font-weight:600;margin-bottom:6px;">✅ All needed IDs uploaded</div>`}
    ${rows}`;
}
function _idLoadThumbs(root){
  (root||document).querySelectorAll('img[data-ref]').forEach(im=>{ if(im.getAttribute('src'))return;
    const ref=im.dataset.ref, box=im.closest('.idthumbs'); const p=box&&box.dataset.pid?_partyById(box.dataset.pid):null;
    const f=p?_idFiles(p,box.dataset.key).find(x=>x.ref===ref):(_idDraft[box&&box.dataset.key]||[]).find(x=>x.ref===ref);
    _idGet(f).then(d=>{ if(d){ im.src=d; im.style.display='block'; const s=im.nextElementSibling; if(s&&s.tagName==='SPAN')s.remove(); } });
  });
}
function _idRefreshAll(){
  const a=document.getElementById('idSlots'); if(a){ a.innerHTML=_idSlotsH(_idFormParty(),a.dataset.pid||''); _idLoadThumbs(a); }

// re-draw every page as a clear JPEG inside a new PDF (same page sizes) — used only for big scans

    if(onPage)onPage(i,pdf.numPages);

async function _signedUpload(inp){

  const t=SIGNED_TYPES.find(x=>x.key===tg.key)||{label:tg.key};

      if(!isPdf&&!isImg){ toast('❌ '+file.name+': please use a PDF or a photo',5000); continue; }
      let data, mime, name=file.name, pages=1;
      if(isPdf){
        if(file.size>40*1048576){ toast('❌ '+file.name+' is over 40 MB — scan in "document" mode and try again',6000); continue; }

        }

        pages=await _pdfPageCount(data);
      } else {
        let im; try{ im=await _imgFromDataUrl(await _readDataUrl(file)); }catch(e){ toast('❌ Could not read '+file.name+' (iPhone HEIC? take a screenshot of it and upload that)',6000); continue; }
        data=_shrinkCanvas(im,SIGNED_PHOTO_TARGET); mime='image/jpeg'; name=name.replace(/\.(heic|heif|png|webp)$/i,'.jpg');
      }
      toast('⏳ Uploading '+name+'…',20000);
      const put=await _idPut(data);
      const meta={ref:put.ref,n:put.n,name,mime,size:Math.round(data.length*0.75),pages,at:new Date().toISOString(),by:user||''};
      const l=(S.leases||[]).find(x=>x.id===tg.lid); if(!l){ toast('❌ Lease not found'); return; }
      if(!l.signed)l.signed={}; (l.signed[tg.key]||(l.signed[tg.key]=[])).push(meta);

      actLog('Signed copy uploaded — '+t.label+' — '+_leaseTitle(l)); sched(); done++;

  }

async function signedView(lid,key,only){

  for(const f of files){
    const d=await _idGet(f); if(!document.getElementById('idvBody'))return;

  const d=l.leaseEnd?dl(l.leaseEnd):null;
  const statusBadge=l.status==='active'?
    (d===null?'<span class="badge badge-grn">Active</span>':d<0?'<span class="badge badge-red">Expired</span>':d<=30?`<span class="badge badge-amb">${d}d left</span>`:`<span class="badge badge-grn">${d}d left</span>`):
    l.status==='renewed'?'<span class="badge badge-blu">Renewed</span>':
    '<span class="badge badge-red">Terminated</span>';
  return`<tr>
    <td><strong>${allTenantNames}</strong></td>
    <td style="white-space:nowrap;">${l.propertyName||prop?.name||'—'}</td>
    <td style="white-space:nowrap;font-weight:600;">${fm(l.rentAmt)}</td>
    <td style="white-space:nowrap;font-size:11px;">${fd(l.startDate)} → ${fd(l.leaseEnd)}</td>
    <td>${'<span class="badge badge-'+(l.template==='ll'?'pur':l.template==='tenancy'?'amb':'blu')+'">'+(l.template==='ll'?'L&L':l.template==='tenancy'?'Tenancy':'Lease')+'</span>'} ${statusBadge}<div style="margin-top:3px;">${_hasSigned(l)?'<span class="badge badge-grn" style="cursor:pointer;" onclick="signedView(\''+l.id+'\',\'deed\')">📑 Signed copy ✓</span>':(l.status==='active'?'<span class="badge badge-red" style="cursor:pointer;" onclick="openLeaseDocs(\''+l.id+'\')">📑 No signed copy</span>':'')}</div></td>
    <td>
      <div class="cl-progress" style="width:60px;"><div class="cl-fill" style="width:${cl.length?Math.round(done/cl.length*100):0}%"></div></div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">${done}/${cl.length}</div>
    </td>
    <td style="white-space:nowrap;">
      <button class="btn btn-ghost btn-xs" onclick="openLease('${l.id}')">📄 Open</button>
      <button class="btn btn-green btn-xs" onclick="shareLeaseWAId('${l.id}')">📤</button>
      ${l.status==='active'&&l.status!=='renewed'?`<button class="btn btn-blue btn-xs" onclick="renewLeaseFlow('${l.id}')">🔄</button>`:''}
      ${isAdmin?`<button class="btn btn-red btn-xs" onclick="deleteLease('${l.id}')">🗑</button>`:''}
    </td>
  </tr>`;
}

function openLease(id){
  const l=(S.leases||[]).find(x=>x.id===id);if(!l)return;
  _curLeaseId=id;
  // Init selected tenants from saved data
  window._selectedTenants=(l.tenantIds||[l.tenantId].filter(Boolean)).map(tid=>(S.parties||[]).find(p=>p.id===tid)).filter(Boolean);
  _openLeaseOverlay(l,'Edit / View Lease');
}

function _openLeaseOverlay(L,title){
  document.getElementById('loTitle').textContent=title;
  window._printL=L; // cache for print
  window._curL=L;
  const ov=document.getElementById('leaseOverlay');
  ov.classList.add('open');
  const pb=document.getElementById('loPrintBtn');
  if(pb)pb.style.display=isAdmin?'':'none';
  const wb=document.getElementById('loWordBtn');
  if(wb)wb.style.display=isAdmin?'':'none';
  showLoTab('form');
  _buildLeaseForm(L);
  _refreshTenantList();
}

function showLoTab(tab){
  _loTab=tab;
  document.querySelectorAll('.lo-tab').forEach((t,i)=>{
    const tabs=['form','clauses','inventory','ids','checklist','preview'];
    t.classList.toggle('active',tabs[i]===tab);
  });
  document.querySelectorAll('.lo-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById('lop-'+tab);
  if(panel)panel.classList.add('active');
  if(tab==='preview')_refreshPreview();
  if(tab==='clauses')_buildClauses();
  if(tab==='inventory')_buildInventory();
  if(tab==='ids')_buildIds();
  if(tab==='checklist')_buildChecklist();
}

function closeLease(){
  document.getElementById('leaseOverlay').classList.remove('open');
  renderLeases();
}

    if(cRow)cRow.style.display='grid';

    if(cRow)cRow.style.display='none';
  }

function saveLease(){
  const L=_collectLease();
  if(!L.landlordId){toast('❌ Select landlord/licensor');return;}
  if(!L.tenantIds||!L.tenantIds.length){toast('❌ Add at least one tenant/licensee');return;}
  if(!L.startDate){toast('❌ Start date is required');return;}
  if(!L.rentAmt){toast('❌ Rent/license fee is required');return;}
  if(!S.leases)S.leases=[];
  if(_curLeaseId){
    const idx=S.leases.findIndex(x=>x.id===_curLeaseId);
    if(idx>=0)S.leases[idx]={...S.leases[idx],...L,id:_curLeaseId};
  } else {
    const newId=uid();_curLeaseId=newId;L.id=newId;
    S.leases.push(L);
  }
  actLog('Lease saved — '+L.tenantName+(L.template==='ll'?' (L&L)':L.template==='tenancy'?' (Tenancy)':' (Lease)'));
  window._printL=L; // update print cache
  sched();toast('✅ Lease saved');
}

function renewLeaseFlow(id){
  const old=(S.leases||[]).find(x=>x.id===id);if(!old)return;
  const origEsc=parseFloat(old.escalation)||10;
  const oldRent=parseFloat(old.rentAmt)||0;
  const calcRent=Math.round(oldRent*(1+origEsc/100));
  openM('🔄 Confirm Renewal Escalation',`
    <div style="background:var(--blue-dim);border:1.5px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--blue);">
      <strong>Agreed escalation: ${origEsc}%</strong><br/>Previous rent: ${fm(oldRent)}<br/>Calculated new rent: ${fm(calcRent)}
    </div>
    <div class="frow1"><label class="flabel">Settled escalation % (edit if needed)</label>
      <input class="finput" id="renewPct" type="number" value="${origEsc}" step="0.5" oninput="const nr=Math.round(${oldRent}*(1+parseFloat(this.value||0)/100));document.getElementById('renewPreview').textContent='₹'+nr.toLocaleString('en-IN');"/>
    </div>
    <div style="background:var(--orange-dim);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:600;color:var(--orange);">New rent will be:</span>
      <span id="renewPreview" style="font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--orange);">${fm(calcRent)}</span>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="applyRenewal('${id}')">Apply & Continue →</button>`
  );
}

function applyRenewal(id){
  const entPct=parseFloat(document.getElementById('renewPct').value||0);
  closeM();
  const old=(S.leases||[]).find(x=>x.id===id);if(!old)return;
  old.status='renewed';
  const newRent=Math.round(parseFloat(old.rentAmt||0)*(1+entPct/100));
  let newStart=old.leaseEnd;
  if(newStart){const d=new Date(newStart+'T00:00:00');d.setDate(d.getDate()+1);newStart=d.toISOString().slice(0,10);}
  let newEnd='';const ten=parseInt(old.tenure)||11;
  if(newStart){const d=new Date(newStart+'T00:00:00');d.setMonth(d.getMonth()+ten);d.setDate(d.getDate()-1);newEnd=d.toISOString().slice(0,10);}
  const newL={...old,id:uid(),status:'active',renewedFrom:id,renewalCount:(old.renewalCount||0)+1,
    startDate:newStart,leaseEnd:newEnd,rentAmt:String(newRent),rentWords:toWords(newRent),
    settledEscalation:entPct,checklist:JSON.parse(JSON.stringify(DEFAULT_CHECKLIST)),signed:{},
    createdAt:today(),createdBy:user};
  if(!S.leases)S.leases=[];
  S.leases.push(newL);
  actLog('Lease renewed — '+old.tenantName+' new rent '+fm(newRent)+' ('+entPct+'%)');
  sched();toast('🔄 Renewal created');
  _curLeaseId=newL.id;
  _openLeaseOverlay(newL,'Renewal — '+old.tenantName);
}

function _h(s){

}

function _templatePointMax(tpl){return tpl==='ll'?12:tpl==='tenancy'?20:30;}

      <label for="tpRemove" style="font-size:13px;cursor:pointer;">Remove this point entirely (delete it from the printed lease, don't just reword it)</label>
    </div>
    <div id="tpTextWrap" style="display:${isRemoved?'none':'block'};">
      <div class="frow1"><label class="flabel">Replacement Wording</label><textarea class="ftextarea" id="tpText" style="min-height:160px;" placeholder="Type the full replacement point text here. Example: 7. That the LESSEE shall...">${_h(isRemoved?'':(val||''))}</textarea></div>

    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="_saveTemplatePoint('${key}')">Save Point</button>`
  );
}

function _saveTemplatePoint(key=''){
  const l=_getActiveLease(true);
  const tpl=l.template||'lease';
  const point=key?key.split('_')[1]:document.getElementById('tpPoint').value;
  const removeChecked=document.getElementById('tpRemove').checked;
  const text=removeChecked?'__REMOVED__':document.getElementById('tpText').value.trim();
  if(!removeChecked&&!text){toast('❌ Replacement text is required, or check "Remove this point entirely"');return;}
  if(!l.templatePointOverrides)l.templatePointOverrides={};
  l.templatePointOverrides[key||`${tpl}_${point}`]=text;
  _syncLeaseBack(l);sched();closeM();_buildClauses();toast(removeChecked?'🗑 Point removed from lease':'✅ Template point saved');
}

}

function _moveClause(idx,dir){
  const l=_getActiveLease(true);
  const cc=l.customClauses;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=cc.length)return;
  [cc[idx],cc[newIdx]]=[cc[newIdx],cc[idx]];
  _syncLeaseBack(l);_buildClauses();
}

// Words that change with one/several parties — filled in for this lease when a point is edited
const PT_GRAMMAR=['LESSEE','Licensee','Owner','the Owner','Tenant','the Tenant','tenant he','tenant his','owner his','lets','vacates','has','confirms','warrants','holds','does','remains','prevents','jointly or severally',"Owner's"];
// Automatic values offered in the editor, per agreement type
const PT_TAGS={
 lease:['rent amount','rent in words','deposit amount','deposit in words','tenure','start date','end date','handover date','escalation %','escalation after','notice period','due day','lock-in','purpose','lessee names','stamp split','overstay amount','overstay in words'],

 tenancy:['rent amount','rent in words','deposit amount','deposit in words','tenure','start date','end date','escalation %','due day','lock-in','grace days','late interest','tenant notice','owner notice','inspection notice','jurisdiction','tenant names','purpose lc']
};
const PT_TPL_NAME={lease:'Lease Deed',ll:'Leave & License',tenancy:'Tenancy Deed'};

function _ptState(L,tpl){ return (L&&L.pt&&L.pt[tpl])||null; }
function _ptOn(L,tpl){
  const p=_ptState(L,tpl);
  return !!(p&&(p.set||Object.keys(p.edit||{}).length||(p.del||[]).length||(p.add||[]).length));
}
function _ptBase(L,tpl){
  const p=_ptState(L,tpl), set=p&&p.set&&S.ptSets&&S.ptSets[p.set];
  return (set&&set.points)||PT_DEFS[tpl]||[];
}
function _ptResolve(L,tpl,includeRemoved){
  const p=_ptState(L,tpl)||{}, ed=p.edit||{}, del=new Set(p.del||[]), add=p.add||[];
  const out=[];
  const pushAdds=anchor=>add.filter(a=>(a.after||'')===anchor).forEach(a=>out.push({id:a.id,title:a.title||'',text:a.text,added:true,edited:false,removed:false}));
  pushAdds('^');
  _ptBase(L,tpl).forEach(b=>{
    const removed=del.has(b.id);
    if(!removed||includeRemoved){
      const e=ed[b.id];
      out.push({id:b.id,title:e?(e.title||''):(b.title||''),text:e?e.text:b.text,origTitle:b.title||'',origText:b.text,edited:!!e,removed,added:false});
    }
    pushAdds(b.id);
  });
  const known=new Set(['^',..._ptBase(L,tpl).map(b=>b.id)]);
  add.filter(a=>!known.has(a.after||'')).forEach(a=>out.push({id:a.id,title:a.title||'',text:a.text,added:true,edited:false,removed:false}));
  return out;
}
// Values for {tags}. ctx carries the values already worked out by the deed renderer.
function _ptVals(L,tpl,c){
  const ll=tpl==='ll', tn=tpl==='tenancy';
  const amt=n=>Number(n||0).toLocaleString('en-IN');
  const D=s=>tn?(s?fmtDeedDate(s):'_______'):fmtDeedDate(s);
  const v={
    'rent amount':amt(L.rentAmt),'rent in words':c.rentWords,'deposit amount':amt(L.secAmt),'deposit in words':c.secWords,
    'tenure':String(c.tenure),'start date':D(L.startDate),'end date':D(L.leaseEnd),'handover date':fmtDeedDate(L.handoverDate||L.startDate),
    'escalation %':L.escalation||(ll?'7.5':'10'),'escalation after':L.escalationAfter||'12',
    'notice period':L.noticePeriod||(ll?'one month':'One month'),'due day':L.paymentDueDate||(ll?'5':'7'),
    'lock-in':L.lockIn||'6','purpose':L.purpose||'Residential','lessee names':c.lesseeAllNames||'',
    'stamp split':L.stampSplit||'70:30','overstay amount':amt(L.overstayPenalty||3000),'overstay in words':toWords(L.overstayPenalty||3000),
    'rent note':c.rentBracketStr||'','charges':c.chargesExcludedStr||'','meter note':c.meterNote||'',
    'LESSEE':c.isJoint?'LESSEES':'LESSEE','Licensee':c.isJoint?'Licensees':'Licensee'
  };
  if(tpl==='lease')v['maintenance terms']=L.rentInclusive==='inclusive'?`note that the monthly rent is inclusive of all maintenance charges${c.inclDesc?' '+c.inclDesc:''}. No separate maintenance charges are payable by the LESSEE${c.isJoint?'S':''}.`:`pay maintenance charges of ${c.maintDesc} and ${c.elecText} directly to the concerned authorities before the due date.`;
  if(ll){
    v['maintenance terms']=L.rentInclusive==='inclusive'?`The monthly license fee of Rs. ${amt(L.rentAmt)}/- is inclusive of all maintenance charges${c.inclDesc?' '+c.inclDesc:''}. No separate maintenance amount is payable by the Licensee${c.isJoint?'s':''}.`:`That maintenance and water charges of ${c.maintDesc} in respect of the said premises shall be paid by the Licensee${c.isJoint?'s':''} separately, over and above the license fee.`;
    v['electricity terms']=L.elecMode==='direct'?'pay the electricity bills directly to the authority':'pay electricity charges '+c.elecText;
  }
  if(tn)Object.assign(v,{
    'maintenance terms':c.maint,'electricity terms':c.elec,'fixtures list':c.fixtures,'meter note':c.meterNote||'',
    'lieu clause':c.lieu?`, or pay ${c.lieu} in lieu of such notice`:'','handover note':L.handoverDate?' ('+D(L.handoverDate)+')':'',
    'grace days':c.grace,'late interest':c.intr,'tenant notice':c.tNotice,'owner notice':c.oNotice,'inspection notice':c.insp,'jurisdiction':c.juris,
    'tenant names':c.tNames,'purpose lc':(L.purpose||'residential').toLowerCase(),
    'Owner':c.O,'the Owner':c.OW,'Tenant':c.T,'the Tenant':c.TN,'tenant he':c.he,'tenant his':c.his,'owner his':c.ownHis,
    'lets':c.multiO?'let':'lets','vacates':c.multiT?'vacate':'vacates','has':c.multiT?'have':'has','confirms':c.multiT?'confirm':'confirms',
    'warrants':c.multiO?'warrant':'warrants','holds':c.multiT?'hold':'holds','does':c.multiT?'do':'does','remains':c.multiT?'remain':'remains',
    'prevents':c.multiT?'prevent':'prevents','jointly or severally':c.multiO?', jointly or severally,':'',"Owner's":c.multiO?"Owners'":"Owner's"
  });

// Values worked out by the renderer are already HTML; text the user typed is escaped.
const PT_HTML_TAGS=new Set(['rent note','charges','meter note','maintenance terms','electricity terms','fixtures list','lieu clause','handover note']);
function _ptFmt(text,vals){
  return String(text||'').split('**').map((seg,i)=>{
    const out=seg.split(/(\{[^{}]+\})/).map(part=>{
      const m=part.match(/^\{([^{}]+)\}$/);
      if(m){ const k=m[1].trim(); const val=vals[k]; if(val!=null)return PT_HTML_TAGS.has(k)?String(val):_h(String(val)); }
      return _h(part).replace(/\n/g,'<br/>');
    }).join('');
    return i%2?'<strong>'+out+'</strong>':out;
  }).join('');
}
function _ptListHTML(L,tpl,ctx){
  const vals=_ptVals(L,tpl,ctx);
  const items=_ptResolve(L,tpl).map((p,i)=>{
    const n=i+1, title=p.title?_ptFmt(p.title,vals):'', body=_ptFmt(p.text,vals);
    if(tpl==='ll')return title?`<li><span class="deed-cl">${n}) ${title}:</span> ${body}</li>`:`<li>${n}) ${body}</li>`;
    if(tpl==='tenancy')return title?`<li><span class="deed-cl">${n}. ${title}:</span> ${body}</li>`:`<li>${n}. ${body}</li>`;
    return `<li>${n}. ${title?`<span class="deed-cl">${title}:</span> `:''}${body}</li>`;
  });
  return '<ol>\n'+items.join('\n')+'\n</ol>';
}

// ── points editor (Clauses tab) ──
let _ptEditing=null;
function _ptCtxFor(L){ try{ window._ptLastCtx=null; _renderDeedHTML(L); }catch(e){} return window._ptLastCtx||{}; }
function _ptEnsure(l,tpl){
  if(!l.pt)l.pt={};
  if(l.pt[tpl])return l.pt[tpl];
  const st={set:'',edit:{},del:[],add:[]};
  // Bring over older per-lease changes (Edit Template Point / custom clauses) so nothing is lost
  const ov=l.templatePointOverrides||{};
  Object.keys(ov).filter(k=>k.indexOf(tpl+'_')===0&&ov[k]).forEach(k=>{
    const b=(PT_DEFS[tpl]||[])[parseInt(k.split('_')[1],10)-1]; if(!b)return;
    if(ov[k]==='__REMOVED__')st.del.push(b.id);
    else st.edit[b.id]={title:'',text:String(ov[k]).replace(/^\s*\d+[\).]\s*/,'')};
  });
  (l.customClauses||[]).forEach(c=>st.add.push({id:'pa_'+uid(),after:'',title:c.title||(tpl==='ll'?'Additional Clause':''),text:c.text||''}));
  l.pt[tpl]=st;
  return st;
}
function _ptGrammarFill(text,vals){ return String(text||'').replace(/\{([^{}]+)\}/g,(m,k)=>PT_GRAMMAR.includes(k.trim())&&vals[k.trim()]!=null?vals[k.trim()]:m); }
function _ptChanged(l){ _syncLeaseBack(l); if(_curLeaseId)sched(); _buildClauses(); }
function _buildClauses(){
  const l=_getActiveLease(true);
  const tpl=l.template||'lease';
  const L=_collectLeaseSafe(l);
  const vals=_ptVals(L,tpl,_ptCtxFor(L));
  const pts=_ptResolve(L,tpl,true);
  const st=_ptState(L,tpl)||{};
  const changed=Object.keys(st.edit||{}).length+(st.del||[]).length+(st.add||[]).length;
  const legacy=!_ptOn(L,tpl)&&(Object.keys(l.templatePointOverrides||{}).some(k=>k.indexOf(tpl+'_')===0&&l.templatePointOverrides[k])||(l.customClauses||[]).length);
  const tagsH=`<div class="pt-tags">Auto values you can use: ${(PT_TAGS[tpl]||[]).map(t=>`<code onclick="_ptInsertTag('{${t}}')">{${t}}</code>`).join(' ')}<br/>Put **double stars** around words to print them bold.</div>`;
  const editor=(id,p)=>`<div class="pt-row pt-editing">
      <input class="finput" id="pt_title" style="margin-bottom:6px;" placeholder="Heading (optional), e.g. Pet Policy" value="${_h(p?_ptGrammarFill(p.title,vals):'')}"/>
      <textarea class="ftextarea" id="pt_txt" style="min-height:120px;" placeholder="Type the point, e.g. That the LESSEE shall not keep pets without written permission of the LESSOR.">${_h(p?_ptGrammarFill(p.text,vals):'')}</textarea>
      ${tagsH}
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn btn-orange btn-xs" type="button" onclick="_ptSave('${id}')">${id==='new'?'Add point':'Save point'}</button>
        <button class="btn btn-ghost btn-xs" type="button" onclick="_ptEditing=null;_buildClauses()">Cancel</button>
        ${p&&p.edited?`<button class="btn btn-ghost btn-xs" type="button" onclick="_ptRestore('${id}')">↩ Original wording</button>`:''}
      </div></div>`;
  let n=0;
  const rows=pts.map((p,i)=>{
    if(_ptEditing===p.id)return editor(p.id,p);
    if(!p.removed)n++;
    const num=p.removed?'—':(tpl==='ll'?n+')':n+'.');
    const tag=p.removed?'<span class="pt-tag red">removed</span>':p.added?'<span class="pt-tag blue">added</span>':p.edited?'<span class="pt-tag orange">edited</span>':'';
    // show the point as it will print (values filled in); the editor shows the {tags}
    const _pl=h=>{const d=document.createElement('div');d.innerHTML=h;return (d.textContent||'').replace(/\s+/g,' ').trim();};
    let shown=_pl(_ptFmt(p.text,vals)); shown=shown.charAt(0).toUpperCase()+shown.slice(1);
    const short=shown.length>150?shown.slice(0,150)+'…':shown;
    const vis=pts.filter(x=>!x.removed), vi=vis.findIndex(x=>x.id===p.id);
    return `<div class="pt-row${p.removed?' pt-removed':''}">
      <div class="pt-txt"><b>${num}</b> ${tag}${p.title?`<u>${_h(_pl(_ptFmt(p.title,vals)))}:</u> `:''}${_h(short)}</div>
      <div class="pt-btns">${p.removed?`<button class="btn btn-ghost btn-xs" type="button" onclick="_ptRestore('${p.id}')">↩ Restore</button>`:`
        ${p.added&&vi>0?`<button class="btn btn-ghost btn-xs" type="button" onclick="_ptMove('${p.id}',-1)">↑</button>`:''}
        ${p.added&&vi<vis.length-1?`<button class="btn btn-ghost btn-xs" type="button" onclick="_ptMove('${p.id}',1)">↓</button>`:''}
        <button class="btn btn-ghost btn-xs" type="button" onclick="_ptEditing='${p.id}';_buildClauses()">✏️</button>
        <button class="btn btn-red btn-xs" type="button" onclick="_ptRemove('${p.id}')">🗑</button>`}
      </div></div>`;
  }).join('');
  document.getElementById('lop-clauses').innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;">
    <div style="font-size:14px;font-weight:700;">Lease Points — ${PT_TPL_NAME[tpl]||tpl}</div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Edit, remove or add points for this lease. Numbering updates by itself. Values in {curly brackets} fill in automatically from the lease form.</div>
  ${legacy?`<div style="font-size:11px;background:var(--amber-dim);border:1px solid var(--amber);border-radius:8px;padding:8px 10px;margin-bottom:10px;">This lease has older point edits or custom clauses. They print exactly as before; they'll be brought into this list the first time you change a point here.</div>`:''}
  ${rows}
  ${_ptEditing==='new'?editor('new',null):`<button class="btn btn-orange btn-sm" type="button" style="margin:6px 0 12px;" onclick="_ptEditing='new';_buildClauses()">+ Add point</button>`}
  <div class="pt-foot">${changed?`<b>${changed}</b> change${changed>1?'s':''} for this lease only. `:(st.set?'Using your saved default points. ':'Using the standard points. ')}Leases already made keep their own wording.
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
      <button class="btn btn-ghost btn-xs" type="button" onclick="_ptSaveDefault()">⭐ Save these as default for new ${PT_TPL_NAME[tpl]||''}s</button>
      ${S.ptDefault&&S.ptDefault[tpl]?`<button class="btn btn-ghost btn-xs" type="button" onclick="_ptResetDefault()">↺ Go back to original default points</button>`:''}
    </div></div>`;
  const t=document.getElementById('pt_txt'); if(t)t.focus();
}
function _collectLeaseSafe(l){ try{ return document.getElementById('lTemplate')?{...l,..._collectLease(),pt:l.pt,templatePointOverrides:l.templatePointOverrides,customClauses:l.customClauses}:l; }catch(e){ return l; } }
function _ptInsertTag(tag){ const t=document.getElementById('pt_txt'); if(!t)return; const s=t.selectionStart||t.value.length; t.value=t.value.slice(0,s)+tag+t.value.slice(t.selectionEnd||s); t.focus(); t.selectionStart=t.selectionEnd=s+tag.length; }
function _ptSave(id){
  const txt=((document.getElementById('pt_txt')||{}).value||'').trim();
  const title=((document.getElementById('pt_title')||{}).value||'').trim();
  if(!txt){toast('❌ Type the point first');return;}
  const l=_getActiveLease(true), tpl=l.template||'lease', st=_ptEnsure(l,tpl);
  if(id==='new'){ st.add=[...(st.add||[]),{id:'pa_'+uid(),after:'',title,text:txt}]; }
  else if((st.add||[]).some(a=>a.id===id)){ st.add=st.add.map(a=>a.id===id?{...a,title,text:txt}:a); }
  else {
    const b=_ptBase(l,tpl).find(x=>x.id===id); st.edit={...(st.edit||{})};
    const L=_collectLeaseSafe(l), vals=_ptVals(L,tpl,_ptCtxFor(L));
    if(b&&_ptGrammarFill(b.text,vals)===txt&&_ptGrammarFill(b.title||'',vals)===title)delete st.edit[id]; else st.edit[id]={title,text:txt};
  }
  _ptEditing=null; _ptChanged(l); toast('✅ Point saved for this lease');
}
function _ptRemove(id){
  const l=_getActiveLease(true), tpl=l.template||'lease', st=_ptEnsure(l,tpl);
  if((st.add||[]).some(a=>a.id===id)){ if(!confirm('Delete this added point?'))return; st.add=st.add.filter(a=>a.id!==id); }
  else st.del=[...new Set([...(st.del||[]),id])];
  _ptEditing=null; _ptChanged(l);
}
function _ptRestore(id){
  const l=_getActiveLease(true), tpl=l.template||'lease', st=_ptEnsure(l,tpl);
  st.del=(st.del||[]).filter(x=>x!==id);
  if(st.edit&&st.edit[id]){ st.edit={...st.edit}; delete st.edit[id]; }
  _ptEditing=null; _ptChanged(l);
}
function _ptMove(id,dir){
  const l=_getActiveLease(true), tpl=l.template||'lease', st=_ptEnsure(l,tpl);
  const order=_ptResolve(l,tpl,false), i=order.findIndex(p=>p.id===id), j=i+dir;
  if(i<0||j<0||j>=order.length)return;
  [order[i],order[j]]=[order[j],order[i]];
  // re-anchor every added point to the built-in point now above it ('^' = top)
  const adds=[]; let anchor='^';
  order.forEach(p=>{ if(p.added){ const a=st.add.find(x=>x.id===p.id); adds.push({...a,after:anchor}); } else anchor=p.id; });
  const removedAnch=st.add.filter(a=>!order.some(p=>p.id===a.id));
  st.add=[...adds,...removedAnch];
  _ptChanged(l);
}
function _ptSaveDefault(){
  const l=_getActiveLease(true), tpl=l.template||'lease';
  if(!confirm(`Make these points the default for every NEW ${PT_TPL_NAME[tpl]||'lease'}?\n\nLeases already made keep their own wording.`))return;
  const L=_collectLeaseSafe(l);
  const pts=_ptResolve(L,tpl,false).map(p=>({id:p.added?'d_'+uid():p.id,title:p.title||'',text:p.text}));
  const sid='ps_'+uid(); if(!S.ptSets)S.ptSets={}; if(!S.ptDefault)S.ptDefault={};
  S.ptSets[sid]={tpl,created:today(),by:user,points:pts}; S.ptDefault[tpl]=sid;
  if(!l.pt)l.pt={};
  l.pt[tpl]={set:sid,edit:{},del:[],add:[]};
  actLog(`Default ${PT_TPL_NAME[tpl]||tpl} points updated (${pts.length} points)`);
  _syncLeaseBack(l); sched(); _buildClauses(); toast('⭐ Saved as default for new leases');
}
function _ptResetDefault(){
  const l=_getActiveLease(true), tpl=l.template||'lease';
  if(!confirm('New leases will start with the original built-in points again. Existing leases are not changed.'))return;
  if(S.ptDefault)delete S.ptDefault[tpl];
  actLog(`Default ${PT_TPL_NAME[tpl]||tpl} points reset to original`); sched(); _buildClauses(); toast('↺ New leases will use the original points');
}
function _ptNewLeasePoints(){
  const pt={}; Object.keys(S.ptDefault||{}).forEach(t=>{ const sid=S.ptDefault[t]; if(sid&&S.ptSets&&S.ptSets[sid])pt[t]={set:sid,edit:{},del:[],add:[]}; });
  return pt;
}

async function _uploadStampPaper(input){
  const file=input.files[0];if(!file)return;
  toast('⏳ Processing stamp paper...',4000);
  try{
    let b64;
    const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
    if(isPdf){
      // Load PDF.js from CDN dynamically
      if(!window.pdfjsLib){
        await new Promise((resolve,reject)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload=resolve;s.onerror=reject;
          document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc=
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const ab=await file.arrayBuffer();
      const pdf=await window.pdfjsLib.getDocument({data:ab}).promise;
      const page=await pdf.getPage(1);
      const vp=page.getViewport({scale:2.2}); // render sharp, then reduce to the target size below
      const canvas=document.createElement('canvas');
      canvas.width=vp.width;canvas.height=vp.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      b64=_shrinkCanvas(canvas);
    } else {
      const raw=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=bad;r.readAsDataURL(file);});
      b64=await _shrinkDataUrl(raw);
    }
    const l=_getActiveLease(true);
    l.stampPaperImg=b64; l._stampShrunk=true;
    _syncLeaseBack(l);sched();_buildIds();toast('✅ Stamp paper saved ('+Math.round(b64.length*0.75/1024)+' KB)');
  }catch(e){toast('❌ Error: '+e.message);console.error(e);}
}

function _clearStampPaper(){
  const l=_getActiveLease(true);
  l.stampPaperImg='';
  _syncLeaseBack(l);sched();_buildIds();toast('🗑 Stamp paper removed');
}

  l.checklist.push({label,done:false,doneBy:'',doneAt:''});
  _syncLeaseBack(l);closeM();_buildChecklist();toast('✅ Added');
}

// ── HELPERS ──
function _getActiveLease(create=false){
  if(_curLeaseId){const l=(S.leases||[]).find(x=>x.id===_curLeaseId);if(l)return l;}
  if(create&&window._curL)return window._curL;
  return window._curL||{};
}
function _syncLeaseBack(l){
  if(_curLeaseId&&S.leases){const idx=S.leases.findIndex(x=>x.id===_curLeaseId);if(idx>=0)S.leases[idx]=l;}
  else window._curL=l;
}

// ── PREVIEW ──
function _formatTemplatePointOverride(n,text){
  const clean=_h(text).replace(/\n/g,'<br/>');
  return /^\s*\d+[\).]/.test(text)?clean:(n+'. '+clean);
}

function _applyTemplatePointOverrides(L,tpl,html){
  if(_ptOn(L,tpl))return html;
  const overrides=L.templatePointOverrides||{};
  Object.keys(overrides).filter(k=>k.indexOf(tpl+'_')===0).forEach(k=>{
    const n=parseInt(k.split('_')[1],10);
    const text=(overrides[k]||'').trim();
    if(!n||!text)return;
    const re=new RegExp('<li>(?:<span class="deed-cl">)?'+n+'[\\).][\\s\\S]*?<\\/li>');
    if(text==='__REMOVED__'){
      // Strip the point entirely rather than replace its wording — this is a deliberate
      // deletion, not a reword, so the <li> itself comes out of the printed lease.
      html=html.replace(re,'');
      return;
    }
    let extra='';
    if(tpl==='ll'&&n===12&&L.customClauses&&L.customClauses.length){
      extra='<br/><br/>'+L.customClauses.map((c,i)=>`<strong>${13+i}) ${_h(c.title||'Additional Clause')}:</strong> ${_h(c.text)}`).join('<br/><br/>');
    }
    html=html.replace(re,'<li>'+_formatTemplatePointOverride(n,text)+extra+'</li>');
  });
  return html;
}

function _refreshPreview(again){
  const L=_collectLease();
  const panel=document.getElementById('lop-preview');
