<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>LeaseDesk — KD Constructions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F4F3EF;--white:#FFFFFF;--card:#FAFAF8;
  --ink:#1A1A18;--ink2:#4A4A44;--muted:#9A9A90;
  --border:#E4E3DB;--border2:#D4D3C8;
  --orange:#E8711A;--orange-dim:#FEF3E8;--orange-mid:#F5A55A;
  --green:#2D9E5F;--green-dim:#EDFAF3;
  --red:#D94040;--red-dim:#FEEFEF;
  --blue:#2563EB;--blue-dim:#EFF4FF;
  --amber:#D97706;--amber-dim:#FFFBEB;
  --purple:#7C3AED;--purple-dim:#F5F3FF;
  --teal:#0D9488;--teal-dim:#F0FDFA;
  --nav-h:165px;--top-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden;}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1A1A18 0%,#2D2D28 60%,#3A2810 100%);padding:24px;}
.login-box{background:var(--white);border-radius:20px;padding:36px 28px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,0.4);}
.login-logo{font-family:'Lora',serif;font-size:26px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.login-logo span{color:var(--orange);}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:28px;}
.login-label{font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:block;}
.login-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);outline:none;transition:border .2s;}
.login-input:focus{border-color:var(--orange);}
.login-btn{width:100%;margin-top:20px;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.3px;}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none;text-align:center;}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;height:100vh;height:100dvh;}
.topbar{height:var(--top-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.top-logo{font-family:'Lora',serif;font-size:18px;font-weight:600;color:var(--ink);}
.top-logo span{color:var(--orange);}
.top-right{display:flex;align-items:center;gap:10px;}
.top-user{font-size:12px;color:var(--muted);font-weight:500;}
.top-role{font-size:10px;background:var(--orange-dim);color:var(--orange);padding:2px 8px;border-radius:10px;font-weight:700;}
.top-logout{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ink2);font-family:inherit;cursor:pointer;}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(var(--nav-h) + 16px);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;flex-wrap:wrap;height:var(--nav-h);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,0.07);}
.bn-item{width:33.3333%;height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;font-family:inherit;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .15s;}
.bn-item:nth-child(3n){border-right:none;}
.bn-item:nth-child(n+7){border-bottom:none;}
.bn-item.active{background:var(--orange-dim);}
.bn-item.active .bn-icon{filter:none;}
.bn-item.active .bn-label{color:var(--orange);}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.2px;}
.bn-item.active .bn-label{color:var(--orange);}

/* ── CARDS & STATS ── */
.card{background:var(--white);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
.card-title{font-size:13px;font-weight:700;color:var(--ink);}
.card-body{padding:14px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
.stat{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:3px;}
.stat-icon{font-size:20px;line-height:1;margin-bottom:2px;}
.stat-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;line-height:1;}
.stat-sub{font-size:10px;color:var(--muted);}
.ora{color:var(--orange);} .grn{color:var(--green);} .red{color:var(--red);} .blu{color:var(--blue);} .amb{color:var(--amber);}

/* ── TABLES ── */
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.btn:active{opacity:.8;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-purple{background:var(--purple);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-ghost{background:var(--bg);color:var(--ink2);border:1px solid var(--border);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-xs{padding:3px 7px;font-size:10px;}
.btn-lg{padding:11px 20px;font-size:14px;border-radius:10px;}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.badge-grn{background:var(--green-dim);color:var(--green);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-amb{background:var(--amber-dim);color:var(--amber);}
.badge-blu{background:var(--blue-dim);color:var(--blue);}
.badge-ora{background:var(--orange-dim);color:var(--orange);}
.badge-pur{background:var(--purple-dim);color:var(--purple);}
.badge-tel{background:var(--teal-dim);color:var(--teal);}

/* ── FORMS ── */
.flabel{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:5px;letter-spacing:.3px;}
.finput,.fselect,.ftextarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--white);outline:none;transition:border .2s;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--orange);}
.ftextarea{min-height:80px;resize:vertical;}
.frow1{margin-bottom:12px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.irow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.irow:last-child{border-bottom:none;}
.irow-label{font-size:12px;color:var(--ink2);}
.irow-value{font-size:12px;font-weight:600;color:var(--ink);}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--white);border-radius:18px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-size:15px;font-weight:700;color:var(--ink);}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}

/* ── LEASE OVERLAY ── */
#leaseOverlay{display:none;position:fixed;inset:0;z-index:150;background:var(--bg);flex-direction:column;}
#leaseOverlay.open{display:flex;}
.lo-head{height:var(--top-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;}
.lo-title{font-family:'Lora',serif;font-size:16px;font-weight:600;flex:1;}
.lo-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0;}
.lo-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--white);flex-shrink:0;overflow-x:auto;}
.lo-tab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;font-family:inherit;}
.lo-tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.lo-panel{display:none;padding:14px;overflow-y:auto;}
.lo-panel.active{display:block;}
.lo-preview{font-family:'Lora',serif;font-size:13px;line-height:1.8;color:var(--ink);padding:20px;background:var(--white);border:1px solid var(--border);border-radius:10px;margin-top:14px;}

/* ── DEED WRAP ── */
.deed-wrap{font-family:'Lora',serif;font-size:13px;line-height:1.8;color:#111;max-width:680px;margin:0 auto;}
.deed-wrap h2{font-size:16px;font-weight:700;text-align:center;text-decoration:underline;letter-spacing:1.5px;margin-bottom:8px;}
.deed-wrap h3{font-size:13px;font-weight:700;text-align:center;margin-bottom:16px;}
.deed-wrap p{text-align:justify;margin-bottom:10px;}
.deed-wrap ol{margin:0;padding-left:0;list-style:none;}
.deed-wrap ol li{margin-bottom:10px;text-align:justify;}
.deed-cl{font-weight:700;text-decoration:underline;}
.deed-pg{page-break-before:always;padding-top:24px;}
.deed-sig{display:flex;width:100%;margin-top:48px;gap:0;}
.deed-sig-blk{flex:1;text-align:center;border-top:1px solid #333;padding-top:8px;font-size:11px;}
.deed-wit{display:flex;width:100%;margin-bottom:32px;margin-top:20px;}
.deed-wit-blk{flex:1;border-top:1px solid #333;padding-top:6px;font-size:11px;min-height:70px;}
.deed-id-page{page-break-before:always;padding-top:20px;}
.deed-id-page h4{font-size:14px;font-weight:700;margin-bottom:16px;text-decoration:underline;}
.deed-id-img{max-width:100%;margin-bottom:12px;border:1px solid #ddd;border-radius:4px;display:block;}
.deed-id-grid{display:table;width:100%;}
.deed-id-cell{display:table-cell;width:50%;vertical-align:top;padding:0 8px 12px 0;}
.deed-id-cell img{max-width:100%;max-height:150px;display:block;border:1px solid #ddd;margin-top:4px;border-radius:3px;}
.inv-table{width:100%;border-collapse:collapse;margin-top:12px;}
.inv-table th,.inv-table td{border:1px solid #333;padding:6px 10px;font-size:12px;text-align:left;}
.inv-table th{background:#f0f0f0;font-weight:700;}
.renewal-banner{background:var(--blue-dim);border:1.5px solid var(--blue);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--blue);font-weight:600;}

/* ── CHECKLIST ── */
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.cl-item:last-child{border-bottom:none;}
.cl-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);appearance:none;-webkit-appearance:none;cursor:pointer;flex-shrink:0;transition:all .2s;position:relative;}
.cl-check:checked{background:var(--green);border-color:var(--green);}
.cl-check:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:12px;font-weight:700;}
.cl-label{flex:1;font-size:13px;color:var(--ink2);}
.cl-meta{font-size:10px;color:var(--muted);}
.cl-progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px;}
.cl-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s;}

/* ── UPLOAD ── */
.upload-box{border:2px dashed var(--border2);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:border .2s;background:var(--bg);}
.upload-box:hover{border-color:var(--orange);}
.upload-thumb{width:100%;max-height:120px;object-fit:contain;border-radius:6px;margin-top:8px;}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{color:var(--muted);font-size:13px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);background:#1A1A18;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}

/* ── PRINT ── */
#printZone{display:none;}
.print-btn-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--orange-dim);border-bottom:1px solid var(--border);}
@media print{
  body>*{display:none!important;}
  #printZone{display:block!important;}
  #printZone .deed-wrap{font-family:"Times New Roman",Times,serif!important;font-size:14.5px!important;line-height:1.84!important;color:#111!important;max-width:none!important;width:100%!important;text-align:justify!important;}
  #printZone .deed-wrap h2{font-size:16px!important;text-align:center!important;}
  #printZone .deed-wrap h3{font-size:14px!important;text-align:center!important;}
  #printZone .deed-wrap p{text-align:justify!important;margin-bottom:10px!important;orphans:3;widows:3;}
  #printZone .deed-wrap ol li{text-align:justify!important;margin-bottom:10px!important;orphans:3;widows:3;}
  #printZone .deed-witness-section{page-break-inside:avoid!important;break-inside:avoid!important;margin-top:22px!important;}
  #printZone .deed-wit{margin-top:34px!important;margin-bottom:20px!important;}
  #printZone .deed-wit-blk{min-height:115px!important;padding-bottom:45px!important;display:table-cell!important;width:50%!important;}
  #printZone .deed-sig{display:table!important;table-layout:fixed!important;width:100%!important;margin-top:28px!important;page-break-inside:avoid!important;break-inside:avoid!important;}
  #printZone .deed-sig-blk{display:table-cell!important;width:50%!important;text-align:center!important;border-top:1px solid #333!important;padding-top:8px!important;}
  #printZone .deed-wit{display:table!important;table-layout:fixed!important;width:100%!important;}
  #printZone .deed-id-img{max-width:60%!important;max-height:200px!important;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  html{-webkit-text-size-adjust:100%;}
  @page{
    size:A4 portrait;
    margin:18mm 18mm 22mm 18mm;
  }
}
</style>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Lease<span>Desk</span></div>
    <div class="login-sub">KD Constructions · Lease Management</div>
    <label class="login-label">Password</label>
    <input class="login-input" type="password" id="lPass" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <div class="login-err" id="lErr">Incorrect password. Try again.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="top-logo">Lease<span>Desk</span></div>
    <div class="top-right">
      <span class="top-user" id="tbUser"></span>
      <span class="top-role" id="tbRole"></span>
      <button class="top-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="content" id="mc"></div>
  <div class="bottom-nav">
    <button class="bn-item active" id="bn-dash" onclick="goTab('dash')"><span class="bn-icon">📊</span><span class="bn-label">Dashboard</span></button>
    <button class="bn-item" id="bn-parties" onclick="goTab('parties')"><span class="bn-icon">👥</span><span class="bn-label">Parties</span></button>
    <button class="bn-item" id="bn-props" onclick="goTab('props')"><span class="bn-icon">🏢</span><span class="bn-label">Properties</span></button>
    <button class="bn-item" id="bn-leases" onclick="goTab('leases')"><span class="bn-icon">📄</span><span class="bn-label">Leases</span></button>
    <button class="bn-item" id="bn-calc" onclick="goTab('calc')"><span class="bn-icon">🧮</span><span class="bn-label">Calculator</span></button>
    <button class="bn-item" id="bn-bylaws" onclick="goTab('bylaws')"><span class="bn-icon">📚</span><span class="bn-label">Bylaws</span></button>
    <button class="bn-item" id="bn-settings" onclick="goTab('settings')"><span class="bn-icon">⚙️</span><span class="bn-label">Settings</span></button>
  </div>
</div>

<!-- LEASE OVERLAY -->
<div id="leaseOverlay">
  <div class="lo-head">
    <button class="btn btn-ghost btn-sm" onclick="closeLease()">← Back</button>
    <div class="lo-title" id="loTitle">New Lease</div>
    <button class="btn btn-orange btn-sm" onclick="saveLease()">💾 Save</button>
  </div>
  <div class="print-btn-bar" id="loPrintBar">
    <button class="btn btn-blue btn-sm" id="loPrintBtn" onclick="printLeaseDeed()">🖨️ Print / PDF</button>
    <button class="btn btn-green btn-sm" onclick="shareLeaseWA()">📤 WhatsApp</button>
  </div>
  <div class="lo-tabs">
    <button class="lo-tab active" onclick="showLoTab('form')">📝 Details</button>
    <button class="lo-tab" onclick="showLoTab('clauses')">📋 Clauses</button>
    <button class="lo-tab" onclick="showLoTab('inventory')">🏠 Inventory</button>
    <button class="lo-tab" onclick="showLoTab('ids')">🪪 ID Proofs</button>
    <button class="lo-tab" onclick="showLoTab('checklist')">✅ Checklist</button>
    <button class="lo-tab" onclick="showLoTab('preview')">👁️ Preview</button>
  </div>
  <div class="lo-body">
    <div class="lo-panel active" id="lop-form"></div>
    <div class="lo-panel" id="lop-clauses"></div>
    <div class="lo-panel" id="lop-inventory"></div>
    <div class="lo-panel" id="lop-ids"></div>
    <div class="lo-panel" id="lop-checklist"></div>
    <div class="lo-panel" id="lop-preview"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="mTitle"></div><button class="modal-close" onclick="closeM()">×</button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot" id="mFoot"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- PRINT ZONE -->
<div id="printZone"></div>

<script>

// ── UTILS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){return new Date().toISOString().slice(0,10);}
function todayDate(){return today();}
function fd(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function fm(n){if(!n&&n!==0)return'—';return'₹'+Number(n).toLocaleString('en-IN');}
function dl(s){if(!s)return null;const d=Math.ceil((new Date(s+'T00:00:00')-new Date().setHours(0,0,0,0))/(1000*60*60*24));return d;}
function mk(){const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;}
function ml(m){if(!m)return'—';const[y,mo]=m.split('-');const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${mn[parseInt(mo)-1]} ${y}`;}

function toWords(n){
  if(!n||isNaN(n))return'';
  const u=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function w(num){
    if(num===0)return'';
    if(num<20)return u[num]+' ';
    if(num<100)return t[Math.floor(num/10)]+(num%10?' '+u[num%10]:'')+' ';
    if(num<1000)return u[Math.floor(num/100)]+' Hundred '+w(num%100);
    if(num<100000)return w(Math.floor(num/1000))+'Thousand '+w(num%1000);
    if(num<10000000)return w(Math.floor(num/100000))+'Lakh '+w(num%100000);
    return w(Math.floor(num/10000000))+'Crore '+w(num%10000000);
  }
  return w(parseInt(n)).replace(/\s+/g,' ').trim()+' Only';
}

function fmtDeedDate(s){
  if(!s)return'____';
  const[y,m,d]=s.split('-');
  const mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return`${parseInt(d)} ${mn[parseInt(m)-1]}, ${y}`;
}

// ── ACTIVITY LOG ──
function actLog(action){
  if(!S.activityLog)S.activityLog=[];
  const now=new Date();
  const dd=String(now.getDate()).padStart(2,'0'),mm=String(now.getMonth()+1).padStart(2,'0'),yyyy=now.getFullYear();
  const hh=String(now.getHours()).padStart(2,'0'),mn=String(now.getMinutes()).padStart(2,'0');
  S.activityLog.unshift({ts:`[${dd}/${mm}/${yyyy} ${hh}:${mn}]`,user:user||'?',action});
  if(S.activityLog.length>200)S.activityLog=S.activityLog.slice(0,200);
}

// ── FIREBASE ──
function toFS(obj){
  function fv(v){
    if(v===null||v===undefined)return{nullValue:null};
    if(typeof v==='boolean')return{booleanValue:v};
    if(typeof v==='number')return{doubleValue:v};
    if(typeof v==='string')return{stringValue:v};
    if(Array.isArray(v))return{arrayValue:{values:v.map(fv)}};
    if(typeof v==='object')return{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,val])=>[k,fv(val)]))}};
    return{stringValue:String(v)};
  }
  return{fields:Object.fromEntries(Object.entries(obj).map(([k,v])=>[k,fv(v)]))};
}
function fromFS(fields){
  if(!fields)return{};
  function fv(v){
    if('nullValue'in v)return null;
    if('booleanValue'in v)return v.booleanValue;
    if('doubleValue'in v)return v.doubleValue;
    if('integerValue'in v)return Number(v.integerValue);
    if('stringValue'in v)return v.stringValue;
    if('arrayValue'in v)return(v.arrayValue.values||[]).map(fv);
    if('mapValue'in v)return fromFS(v.mapValue.fields);
    return null;
  }
  return Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,fv(v)]));
}

let _lc=0,_rc=0;
async function save(){
  _lc++;const lc=_lc;
  try{
    const body=JSON.stringify({...toFS(S),fields:{...toFS(S).fields,_lc:{integerValue:String(lc)}}});
    await fetch(`${FB_URL}?key=${FB_KEY}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  }catch(e){console.error('Save error',e);}
}

async function loadData(){
  try{
    const r=await fetch(`${FB_URL}?key=${FB_KEY}`);
    if(!r.ok){renderTab();return;}
    const data=await r.json();
    const remote=fromFS(data.fields||{});
    const rc=parseInt(remote._lc)||0,lc=parseInt(_lc)||0;
    if(rc>=lc){
      S={...S,...remote};
      if(!S.parties)S.parties=[];
      if(!S.properties)S.properties=[];
      if(!S.leases)S.leases=[];
      if(!S.staff)S.staff=[];
      if(!S.activityLog)S.activityLog=[];
    }
  }catch(e){console.error('Load error',e);}
  renderTab();
}

  const err=document.getElementById('lErr');
  // Check hard users

var _panB64='',_aadhaarB64='';

async function previewImg(input,previewId,varName){
  const file=input.files[0];if(!file)return;
  try{
    const b64=await compressImage(file,800,0.75);
    window[varName]=b64;
    const img=document.getElementById(previewId);
    if(img){img.src=b64;img.style.display='block';}
  }catch(e){toast('❌ Error loading image');}
}

function compressImage(file,maxW=800,quality=0.75){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const ratio=Math.min(maxW/img.width,maxW/img.height,1);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*ratio;canvas.height=img.height*ratio;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=rej;img.src=e.target.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}

function saveParty(type,editId=null){
  const name=(document.getElementById('pName').value||'').trim();
  if(!name){toast('❌ Name is required');return;}
  const p={
    id:editId||uid(),type,
    name,relation:document.getElementById('pRelation')?.value||'S/o',fatherName:document.getElementById('pFather').value,
    address:document.getElementById('pAddr').value,
    aadhaar:document.getElementById('pAadhaar').value,
    pan:document.getElementById('pPan').value,
    phone:document.getElementById('pPhone').value,
    email:document.getElementById('pEmail').value,
    panImg:_panB64||(editId?(S.parties||[]).find(x=>x.id===editId)?.panImg||'':''),
    aadhaarImg:_aadhaarB64||(editId?(S.parties||[]).find(x=>x.id===editId)?.aadhaarImg||'':''),
    createdAt:editId?((S.parties||[]).find(x=>x.id===editId)?.createdAt||today()):today(),
    createdBy:editId?((S.parties||[]).find(x=>x.id===editId)?.createdBy||user):user
  };
  if(!S.parties)S.parties=[];
  if(editId){const idx=S.parties.findIndex(x=>x.id===editId);if(idx>=0)S.parties[idx]=p;}
  else S.parties.push(p);
  actLog((editId?'Edited':'Added')+' party — '+name+' ('+type+')');
  sched();closeM();renderParties();toast('✅ Saved');
}

function deleteParty(id){
  if(!confirm('Delete this party?'))return;

  actLog('Deleted party — '+(p?.name||id));
  S.parties=(S.parties||[]).filter(x=>x.id!==id);
  sched();renderParties();toast('🗑 Deleted');
}

function autoSqMt(){
  const ft=parseFloat(document.getElementById('prArea').value)||0;
  const sqmt=document.getElementById('prAreaSqMt');
  if(sqmt)sqmt.value=ft?(ft*0.0929).toFixed(3):'';
}

function openAddProp(){
  openM('🏢 Add Property',propFormHTML(),
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="saveProp()">Save Property →</button>`
  );
}
function openEditProp(id){
  const p=(S.properties||[]).find(x=>x.id===id);if(!p)return;
  openM('✏️ Edit Property',propFormHTML(p),
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="saveProp('${id}')">Update →</button>`
  );
}
function saveProp(editId=null){
  const landlordId=document.getElementById('prLandlord').value;
  const address=document.getElementById('prAddr').value.trim();
  const name=document.getElementById('prName').value.trim();
  if(!landlordId){toast('❌ Select a landlord');return;}
  if(!address&&!name){toast('❌ Address is required');return;}
  const p={
    id:editId||uid(),
    name:name||address.split(',')[0],
    landlordId,address,
    floor:document.getElementById('prFloor').value,
    area:document.getElementById('prArea').value,
    areaSqMt:document.getElementById('prAreaSqMt').value,
    carParks:document.getElementById('prCar').value,
    rooms:document.getElementById('prRooms').value,
    description:document.getElementById('prDesc').value,
    createdAt:editId?((S.properties||[]).find(x=>x.id===editId)?.createdAt||today()):today()
  };
  if(!S.properties)S.properties=[];
  if(editId){const idx=S.properties.findIndex(x=>x.id===editId);if(idx>=0)S.properties[idx]=p;}
  else S.properties.push(p);
  actLog((editId?'Edited':'Added')+' property — '+p.name);
  sched();closeM();renderProps();toast('✅ Saved');
}
function deleteProp(id){
  if(!confirm('Delete this property?'))return;
  const p=(S.properties||[]).find(x=>x.id===id);
  actLog('Deleted property — '+(p?.name||id));
  S.properties=(S.properties||[]).filter(x=>x.id!==id);
  sched();renderProps();toast('🗑 Deleted');
}

    <div style="overflow-x:auto;"><table class="tbl" style="min-width:600px;">
      <thead><tr><th>Tenant</th><th>Property</th><th>Rent</th><th>Period</th><th>Status</th><th></th></tr></thead>

function leaseRow(l){
  const party=(S.parties||[]).find(p=>p.id===l.tenantId);
  const allTenantNames=l.tenantNames&&l.tenantNames.length?l.tenantNames.join(', '):(l.tenantName||party?.name||'—');
  const prop=(S.properties||[]).find(p=>p.id===l.propertyId);
  const cl=l.checklist||[];
  const done=cl.filter(c=>c.done).length;
  const d=l.leaseEnd?dl(l.leaseEnd):null;
  const statusBadge=l.status==='active'?
    (d===null?'<span class="badge badge-grn">Active</span>':d<0?'<span class="badge badge-red">Expired</span>':d<=30?`<span class="badge badge-amb">${d}d left</span>`:`<span class="badge badge-grn">${d}d left</span>`):
    l.status==='renewed'?'<span class="badge badge-blu">Renewed</span>':
    '<span class="badge badge-red">Terminated</span>';
  return`<tr>
    <td><strong>${allTenantNames}</strong></td>
    <td style="white-space:nowrap;">${l.propertyName||prop?.name||'—'}</td>
    <td style="white-space:nowrap;font-weight:600;">${fm(l.rentAmt)}</td>
    <td style="white-space:nowrap;font-size:11px;">${fd(l.startDate)} → ${fd(l.leaseEnd)}</td>
    <td>${'<span class="badge badge-'+(l.template==='ll'?'pur':'blu')+'">'+(l.template==='ll'?'L&L':'Lease')+'</span>'} ${statusBadge}</td>
    <td>
      <div class="cl-progress" style="width:60px;"><div class="cl-fill" style="width:${cl.length?Math.round(done/cl.length*100):0}%"></div></div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">${done}/${cl.length}</div>
    </td>
    <td style="white-space:nowrap;">
      <button class="btn btn-ghost btn-xs" onclick="openLease('${l.id}')">📄 Open</button>
      <button class="btn btn-green btn-xs" onclick="shareLeaseWAId('${l.id}')">📤</button>
      ${l.status==='active'&&l.status!=='renewed'?`<button class="btn btn-blue btn-xs" onclick="renewLeaseFlow('${l.id}')">🔄</button>`:''}
      ${isAdmin?`<button class="btn btn-red btn-xs" onclick="deleteLease('${l.id}')">🗑</button>`:''}
    </td>
  </tr>`;
}

function showLoTab(tab){
  _loTab=tab;
  document.querySelectorAll('.lo-tab').forEach((t,i)=>{
    const tabs=['form','clauses','inventory','ids','checklist','preview'];
    t.classList.toggle('active',tabs[i]===tab);
  });
  document.querySelectorAll('.lo-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById('lop-'+tab);
  if(panel)panel.classList.add('active');
  if(tab==='preview')_refreshPreview();
  if(tab==='clauses')_buildClauses();
  if(tab==='inventory')_buildInventory();
  if(tab==='ids')_buildIds();
  if(tab==='checklist')_buildChecklist();
}

function calcLeaseEnd(){
  const st=document.getElementById('lStart').value;
  let ten=document.getElementById('lTenure').value;
  const cRow=document.getElementById('lCustomTenureRow');
  if(ten==='custom'){
    if(cRow)cRow.style.display='grid';
    ten=document.getElementById('lCustomTenure').value||0;
  } else {
    if(cRow)cRow.style.display='none';
  }
  if(!st||!ten)return;
  const d=new Date(st+'T00:00:00');
  d.setMonth(d.getMonth()+parseInt(ten));d.setDate(d.getDate()-1);
  const ye=document.getElementById('lEnd');
  if(ye)ye.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── COLLECT LEASE ──
function _collectLease(){
  const landlordId=_lv('lLandlord'),propertyId=_lv('lProp');
  const landlordParty=(S.parties||[]).find(p=>p.id===landlordId);
  const propObj=(S.properties||[]).find(p=>p.id===propertyId);
  let ten=_lv('lTenure');
  if(ten==='custom')ten=_lv('lCustomTenure');
  const rentAmt=_lv('lRent');
  const secAmt=_lv('lSec');
  const existing=_curLeaseId?(S.leases||[]).find(x=>x.id===_curLeaseId)||window._curL||{}:window._curL||{};
  const sel=window._selectedTenants||[];
  const tenantIds=sel.map(t=>t.id);
  const tenantNames=sel.map(t=>t.name);
  // Keep single tenantId for backward compat
  const tenantId=tenantIds[0]||existing.tenantId||'';
  const tenantName=tenantNames.join(' & ')||existing.tenantName||'';
  const result={
    ...(existing),
    template:_lv('lTemplate')||'lease',
    agrDate:_lv('lAgrDate'),agrCity:_lv('lAgrCity'),
    landlordId,tenantId,tenantIds,propertyId,
    landlordName:landlordParty?.name||'',
    tenantName,tenantNames,propertyName:propObj?.name||propObj?.address||'',
    startDate:_lv('lStart'),leaseEnd:_lv('lEnd'),tenure:ten,
    handoverDate:_lv('lHandover'),
    rentAmt,rentWords:toWords(rentAmt),
    secAmt,secWords:toWords(secAmt),
    rentBracket:document.getElementById('lRentBracketEnabled')?.checked||false,
    rentBracketText:_lv('lRentBracketText'),
    escalation:_lv('lEsc'),escalationAfter:_lv('lEscAfter'),
    lockIn:_lv('lLockIn'),noticePeriod:_lv('lNotice'),
    paymentDueDate:_lv('lPayDue'),overstayPenalty:_lv('lOverstay'),
    purpose:_lv('lPurpose'),stampSplit:_lv('lStamp'),
    maintCharges:_lv('lMaint'),waterRwaCharges:_lv('lWater')||'',
    elecMode:_lv('lElecMode')||'meter',elecAmt:_lv('lElecAmt'),
    furnished:_lv('lFurnished')||'fully',
    rentInclusive:_lv('lRentInclusive')||'exclusive',
    rentInclusiveOf:_lv('lRentInclusiveOf'),
    maintDesc:_lv('lMaintDesc')||'',
    maintBracket:document.getElementById('lMaintBracketEnabled')?.checked||false,
    maintBracketText:_lv('lMaintBracketText'),
    inclBracket:document.getElementById('lInclBracketEnabled')?.checked||false,
    inclBracketText:_lv('lInclBracketText'),
    meterNo:_lv('lMeterNo'),openingReading:_lv('lMeterReading'),meterReadingDate:_lv('lMeterDate'),
    customClauses:existing.customClauses||[],
    templatePointOverrides:existing.templatePointOverrides||{},
    inventory:existing.inventory||[],
    checklist:existing.checklist||JSON.parse(JSON.stringify(DEFAULT_CHECKLIST)),
    lessorPanImg:existing.lessorPanImg||'',lessorAadhaarImg:existing.lessorAadhaarImg||'',
    lesseePanImg:existing.lesseePanImg||'',lesseeAadhaarImg:existing.lesseeAadhaarImg||'',
    partyIdImgs:existing.partyIdImgs||{},
    stampPaperImg:existing.stampPaperImg||'',
    status:existing.status||'active',
    createdAt:existing.createdAt||today(),createdBy:existing.createdBy||user,
    renewedFrom:existing.renewedFrom||'',renewalCount:existing.renewalCount||0
  };
  window._printL=result; // cache for print
  return result;
}

function saveLease(){
  const L=_collectLease();
  if(!L.landlordId){toast('❌ Select landlord/licensor');return;}
  if(!L.tenantIds||!L.tenantIds.length){toast('❌ Add at least one tenant/licensee');return;}
  if(!L.startDate){toast('❌ Start date is required');return;}
  if(!L.rentAmt){toast('❌ Rent/license fee is required');return;}
  if(!S.leases)S.leases=[];
  if(_curLeaseId){
    const idx=S.leases.findIndex(x=>x.id===_curLeaseId);
    if(idx>=0)S.leases[idx]={...S.leases[idx],...L,id:_curLeaseId};
  } else {
    const newId=uid();_curLeaseId=newId;L.id=newId;
    S.leases.push(L);
  }
  actLog('Lease saved — '+L.tenantName+(L.template==='ll'?' (L&L)':' (Lease)'));
  window._printL=L; // update print cache
  sched();toast('✅ Lease saved');
}

function deleteLease(id){
  if(!confirm('Delete this lease?'))return;
  const l=(S.leases||[]).find(x=>x.id===id);
  actLog('Deleted lease — '+(l?.tenantName||id));
  S.leases=(S.leases||[]).filter(x=>x.id!==id);
  sched();renderLeases();toast('🗑 Deleted');
}

// ── RENEWAL ──
function renewLeaseFlow(id){
  const old=(S.leases||[]).find(x=>x.id===id);if(!old)return;
  const origEsc=parseFloat(old.escalation)||10;
  const oldRent=parseFloat(old.rentAmt)||0;
  const calcRent=Math.round(oldRent*(1+origEsc/100));
  openM('🔄 Confirm Renewal Escalation',`
    <div style="background:var(--blue-dim);border:1.5px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--blue);">
      <strong>Agreed escalation: ${origEsc}%</strong><br/>Previous rent: ${fm(oldRent)}<br/>Calculated new rent: ${fm(calcRent)}
    </div>
    <div class="frow1"><label class="flabel">Settled escalation % (edit if needed)</label>
      <input class="finput" id="renewPct" type="number" value="${origEsc}" step="0.5" oninput="const nr=Math.round(${oldRent}*(1+parseFloat(this.value||0)/100));document.getElementById('renewPreview').textContent='₹'+nr.toLocaleString('en-IN');"/>
    </div>
    <div style="background:var(--orange-dim);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:600;color:var(--orange);">New rent will be:</span>
      <span id="renewPreview" style="font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--orange);">${fm(calcRent)}</span>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="applyRenewal('${id}')">Apply & Continue →</button>`
  );
}

function applyRenewal(id){
  const entPct=parseFloat(document.getElementById('renewPct').value||0);
  closeM();
  const old=(S.leases||[]).find(x=>x.id===id);if(!old)return;
  old.status='renewed';
  const newRent=Math.round(parseFloat(old.rentAmt||0)*(1+entPct/100));
  let newStart=old.leaseEnd;
  if(newStart){const d=new Date(newStart+'T00:00:00');d.setDate(d.getDate()+1);newStart=d.toISOString().slice(0,10);}
  let newEnd='';const ten=parseInt(old.tenure)||11;
  if(newStart){const d=new Date(newStart+'T00:00:00');d.setMonth(d.getMonth()+ten);d.setDate(d.getDate()-1);newEnd=d.toISOString().slice(0,10);}
  const newL={...old,id:uid(),status:'active',renewedFrom:id,renewalCount:(old.renewalCount||0)+1,
    startDate:newStart,leaseEnd:newEnd,rentAmt:String(newRent),rentWords:toWords(newRent),
    settledEscalation:entPct,checklist:JSON.parse(JSON.stringify(DEFAULT_CHECKLIST)),
    createdAt:today(),createdBy:user};
  if(!S.leases)S.leases=[];
  S.leases.push(newL);
  actLog('Lease renewed — '+old.tenantName+' new rent '+fm(newRent)+' ('+entPct+'%)');
  sched();toast('🔄 Renewal created');
  _curLeaseId=newL.id;
  _openLeaseOverlay(newL,'Renewal — '+old.tenantName);
}

function _buildClauses(){
  const l=_getActiveLease(true);
  const cc=l.customClauses||[];
  const tpl=l.template||'lease';
  const overrides=l.templatePointOverrides||{};
  const ovKeys=Object.keys(overrides).filter(k=>k.indexOf(tpl+'_')===0&&overrides[k]);
  const panel=document.getElementById('lop-clauses');
  panel.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
    <div style="font-size:13px;color:var(--ink2);">Edit existing template points for this lease only</div>
    <button class="btn btn-blue btn-sm" onclick="_editTemplatePoint()">✏️ Edit Template Point</button>
  </div>
  <div id="templatePointList" style="margin-bottom:18px;">
    ${ovKeys.length?ovKeys.map(k=>{
      const point=k.split('_')[1];
      return `<div class="card" style="margin-bottom:10px;">
        <div class="card-head">
          <div class="card-title" style="font-size:12px;">Point ${point} override</div>
          <div style="display:flex;gap:5px;">
            <button class="btn btn-ghost btn-xs" onclick="_editTemplatePoint('${k}')">✏️</button>
            <button class="btn btn-red btn-xs" onclick="_deleteTemplatePoint('${k}')">🗑</button>
          </div>
        </div>
        <div class="card-body" style="font-size:12px;color:var(--ink2);">${_h(overrides[k])}</div>
      </div>`;
    }).join(''):`<div class="empty" style="padding:18px;"><div class="empty-icon">✏️</div><div class="empty-text">No existing template points edited for this lease.</div></div>`}
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
    <div style="font-size:13px;color:var(--ink2);">Add, edit or reorder extra custom clauses</div>
    <button class="btn btn-orange btn-sm" onclick="_addClause()">+ Add Clause</button>
  </div>
  <div id="clauseList">
    ${cc.length?cc.map((c,i)=>`
    <div class="card" style="margin-bottom:10px;" id="clause_${i}">
      <div class="card-head">
        <div class="card-title" style="font-size:12px;">${i+1}. ${c.title||'Untitled Clause'}</div>
        <div style="display:flex;gap:5px;">
          ${i>0?`<button class="btn btn-ghost btn-xs" onclick="_moveClause(${i},-1)">↑</button>`:''}
          ${i<cc.length-1?`<button class="btn btn-ghost btn-xs" onclick="_moveClause(${i},1)">↓</button>`:''}
          <button class="btn btn-ghost btn-xs" onclick="_editClause(${i})">✏️</button>
          <button class="btn btn-red btn-xs" onclick="_deleteClause(${i})">🗑</button>
        </div>
      </div>
      <div class="card-body" style="font-size:12px;color:var(--ink2);">${c.text}</div>
    </div>`).join(''):`<div class="empty" style="padding:24px;"><div class="empty-icon">📋</div><div class="empty-text">No custom clauses. Template clauses are included automatically.</div></div>`}
  </div>`;
}


function _h(s){
  return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function _templatePointMax(tpl){return tpl==='ll'?12:30;}

function _editTemplatePoint(key=''){
  const l=_getActiveLease(true);
  const tpl=l.template||'lease';
  const point=key?key.split('_')[1]:'1';
  const val=key?(l.templatePointOverrides||{})[key]:'';
  const opts=Array.from({length:_templatePointMax(tpl)},(_,i)=>{
    const n=String(i+1);
    return `<option value="${n}" ${n===point?'selected':''}>Point ${n}</option>`;
  }).join('');
  openM('✏️ Edit Existing Template Point',`
    <div class="frow1"><label class="flabel">Template Point</label><select class="fselect" id="tpPoint" ${key?'disabled':''}>${opts}</select></div>
    <div class="frow1"><label class="flabel">Replacement Wording</label><textarea class="ftextarea" id="tpText" style="min-height:160px;" placeholder="Type the full replacement point text here. Example: 7. That the LESSEE shall...">${_h(val||'')}</textarea></div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;">This changes only the current lease. Leave the normal template untouched.</div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="_saveTemplatePoint('${key}')">Save Point</button>`
  );
}

function _saveTemplatePoint(key=''){

async function _uploadStampPaper(input){
  const file=input.files[0];if(!file)return;
  toast('⏳ Processing stamp paper...',4000);
  try{
    let b64;
    const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
    if(isPdf){
      // Load PDF.js from CDN dynamically
      if(!window.pdfjsLib){
        await new Promise((resolve,reject)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload=resolve;s.onerror=reject;
          document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc=
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const ab=await file.arrayBuffer();
      const pdf=await window.pdfjsLib.getDocument({data:ab}).promise;
      const page=await pdf.getPage(1);
      const vp=page.getViewport({scale:2.5}); // 2.5× = sharp A4
      const canvas=document.createElement('canvas');
      canvas.width=vp.width;canvas.height=vp.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      b64=canvas.toDataURL('image/jpeg',0.92);
    } else {
      b64=await compressImage(file,2400,0.92); // high-res for images
    }
    const l=_getActiveLease(true);
    l.stampPaperImg=b64;
    _syncLeaseBack(l);sched();_buildIds();toast('✅ Stamp paper saved');
  }catch(e){toast('❌ Error: '+e.message);console.error(e);}
}

function _clearStampPaper(){
  const l=_getActiveLease(true);
  l.stampPaperImg='';
  _syncLeaseBack(l);sched();_buildIds();toast('🗑 Stamp paper removed');
}

// ── PREVIEW ──
function _formatTemplatePointOverride(n,text){
  const clean=_h(text).replace(/\n/g,'<br/>');
  return /^\s*\d+[\).]/.test(text)?clean:(n+'. '+clean);
}

function _applyTemplatePointOverrides(L,tpl,html){
  const overrides=L.templatePointOverrides||{};
  Object.keys(overrides).filter(k=>k.indexOf(tpl+'_')===0).forEach(k=>{
    const n=parseInt(k.split('_')[1],10);
    const text=(overrides[k]||'').trim();
    if(!n||!text)return;
    let extra='';
    if(tpl==='ll'&&n===12&&L.customClauses&&L.customClauses.length){
      extra='<br/><br/>'+L.customClauses.map((c,i)=>`<strong>${13+i}) ${_h(c.title||'Additional Clause')}:</strong> ${_h(c.text)}`).join('<br/><br/>');
    }
    const re=new RegExp('<li>(?:<span class="deed-cl">)?'+n+'[\\).][\\s\\S]*?<\\/li>');
    html=html.replace(re,'<li>'+_formatTemplatePointOverride(n,text)+extra+'</li>');
  });
  return html;
}

// ── DEED HTML ──
function _renderDeedHTML(L){
  const landlord=(S.parties||[]).find(p=>p.id===L.landlordId)||{};
  // Support multiple tenants
  const tenantIdList=L.tenantIds&&L.tenantIds.length?L.tenantIds:[L.tenantId].filter(Boolean);
  const tenantList=tenantIdList.map(id=>(S.parties||[]).find(p=>p.id===id)||{});
  const prop=(S.properties||[]).find(p=>p.id===L.propertyId)||{};
  const t=L.template==='ll';
  const tenure=parseInt(L.tenure)||11;
  const rentWords=L.rentWords||toWords(L.rentAmt);
  const secWords=L.secWords||toWords(L.secAmt);

  // Rent bracket note — free text in parentheses after rent amount
  let rentBracketStr='';
  if(L.rentBracket&&L.rentBracketText){
    rentBracketStr=` (${L.rentBracketText})`;
  }
  const furnishedLabel=L.furnished==='fully'?'Fully Furnished':L.furnished==='semi'?'Semi Furnished':'';
  const furnishedSuffix=furnishedLabel?(`, ${furnishedLabel}${L.inventory&&L.inventory.length?' as per Annexure A attached':''}`):'';
  // Address first, then floor/type, then area, then rooms
  const propDesc=`${prop.address||'_______'}`
    +`${prop.floor?', consisting of '+prop.floor:''}${furnishedSuffix}`
    +`${prop.area?', having covered area of '+prop.area+' Sq.Ft. Appx. ('+prop.areaSqMt+' Sq.Mtrs.)':''}`
    +`${prop.rooms?', '+prop.rooms:''}`
    +`${prop.carParks?', along-with earmarked space for '+prop.carParks+' car park(s)':''}`;

  const lessorId=landlord.aadhaar&&landlord.pan?` (Aadhaar No: ${landlord.aadhaar} & PAN No. ${landlord.pan})`
    :landlord.aadhaar?` (Aadhaar No: ${landlord.aadhaar})`
    :landlord.pan?` (PAN No. ${landlord.pan})`:'';
  const lessorRel=landlord.relation||'S/o';
  const lessorLine=`<strong>${landlord.name||'_______'}${lessorId}${landlord.fatherName?' '+lessorRel+' '+landlord.fatherName:''} Residing at ${landlord.address||'_______'}</strong>`;

  // Build lessee lines for all tenants
  const lesseeLines=tenantList.map(tenant=>{
    const lesseeId=tenant.aadhaar&&tenant.pan?` (Aadhaar No: ${tenant.aadhaar} & PAN No. ${tenant.pan})`
      :tenant.aadhaar?` (Aadhaar No: ${tenant.aadhaar})`
      :tenant.pan?` (PAN No. ${tenant.pan})`:'';
    const lesseeRel=tenant.relation||'S/o';
    return `<strong>${tenant.name||'_______'}${lesseeId}${tenant.fatherName?' '+lesseeRel+' '+tenant.fatherName:''} Residing at ${tenant.address||'_______'}</strong>`;
  });
  const lesseeLine=lesseeLines.join('<br/>AND<br/>');
  const lesseePrimary=tenantList[0]?.name||L.tenantName||'_______';
  const lesseeAllNames=tenantList.map(t=>t.name||'_______').join(', ');
  const isJoint=tenantList.length>1;

  // Monthly charges / rent inclusive text
  const elecText=L.elecMode==='fixed'&&L.elecAmt
    ?`electricity charges of Rs. ${Number(L.elecAmt).toLocaleString('en-IN')}/- per month`
    :L.elecMode==='direct'?'electricity charges (paid directly by Lessee to authority)'
    :'electricity charges (as per meter reading)';

  // Build the maintenance charges description for exclusive mode
  let maintDesc='';
  if(L.rentInclusive!=='inclusive'){
    if(L.maintBracket&&L.maintBracketText){
      // Use the bracket text as the full description
      const amtPart=L.maintCharges&&Number(L.maintCharges)>0
        ?`Rs. ${Number(L.maintCharges).toLocaleString('en-IN')}/- per month `:'';
      maintDesc=`${amtPart}(${L.maintBracketText})`;
    } else if(L.maintCharges&&Number(L.maintCharges)>0){
      maintDesc=`Rs. ${Number(L.maintCharges).toLocaleString('en-IN')}/- per month`;
    } else {
      maintDesc='as applicable';
    }
  }

  // Build the inclusive description
  let inclDesc='';
  if(L.rentInclusive==='inclusive'){
    if(L.inclBracket&&L.inclBracketText){
      inclDesc=`(${L.inclBracketText})`;
    }
  }

  // rentChargesClause — used in clause 1 / clause 2 of deed
  let rentChargesClause='';
  if(L.rentInclusive==='inclusive'){
    rentChargesClause=`inclusive of all maintenance charges${inclDesc?' '+inclDesc:''}`;
  } else {
    const excl=[];
    excl.push(`maintenance charges ${maintDesc}`);
    excl.push(elecText);
    rentChargesClause=excl.join(' and ');
  }

  const chargesExcludedStr=rentChargesClause;

  // Meter reading note
  const meterNote=L.meterNo||L.openingReading?`<p style="margin-top:8px;"><strong>Opening Meter Reading:</strong> Meter No. ${L.meterNo||'_______'}, Reading: ${L.openingReading||'_______'} units as on ${fd(L.meterReadingDate||L.startDate)}.</p>`:'';

  if(t){
    // ── LEAVE & LICENSE ──
    return _applyTemplatePointOverrides(L,'ll',`
<h2>LEAVE AND LICENSE AGREEMENT</h2>

function _idPagesHTML(L,isLL){
  const parts=[];
  const lRole=isLL?'Licensor':'Lessor';
  const tRole=isLL?'Licensee':'Lessee';
  const partyIdImgs=L.partyIdImgs||{};

  // Helper: build a single party's ID block (PAN + Aadhaar side by side)
  function partyBlock(party,role){
    const imgs=partyIdImgs[party.id]||{};
    // 1st priority: IDs uploaded in Lease → ID Proofs tab
    let pan=imgs.pan||'';
    let aadhaar=imgs.aadhaar||'';
    // 2nd priority: legacy single-slot lease fields
    if(!pan&&!aadhaar){
      if(role===lRole){pan=L.lessorPanImg||'';aadhaar=L.lessorAadhaarImg||'';}
      else{pan=L.lesseePanImg||'';aadhaar=L.lesseeAadhaarImg||'';}
    }
    // 3rd priority: IDs from party record (Parties tab) — covers both lessor & lessee
    if(!pan)pan=party.panImg||'';
    if(!aadhaar)aadhaar=party.aadhaarImg||'';
    if(!pan&&!aadhaar)return'';
    return`<div style="margin-bottom:20px;page-break-inside:avoid;">
      <p style="font-weight:700;margin-bottom:6px;font-size:12px;border-bottom:1px solid #ccc;padding-bottom:4px;">${role}: ${party.name||'_______'}</p>
      <div class="deed-id-grid">
        ${pan?`<div class="deed-id-cell"><strong style="font-size:11px;">PAN Card</strong><img src="${pan}" style="width:100%;height:260px;object-fit:contain;display:block;border:1px solid #ddd;margin-top:4px;"/></div>`:''}
        ${aadhaar?`<div class="deed-id-cell"><strong style="font-size:11px;">Aadhaar Card</strong><img src="${aadhaar}" style="width:100%;height:260px;object-fit:contain;display:block;border:1px solid #ddd;margin-top:4px;"/></div>`:''}
      </div>
    </div>`;
  }

  const landlordIds=[L.landlordId].filter(Boolean);
  const tenantIds2=L.tenantIds&&L.tenantIds.length?L.tenantIds:[L.tenantId].filter(Boolean);
  const allLandlords=landlordIds.map(id=>(S.parties||[]).find(p=>p.id===id)).filter(Boolean);
  const allTenants=tenantIds2.map(id=>(S.parties||[]).find(p=>p.id===id)).filter(Boolean);

  // Landlord IDs — all on ONE page, page-break-before:always after deed ends
  const lessorBlocks=allLandlords.map(p=>partyBlock(p,lRole)).filter(Boolean).join('');
  if(lessorBlocks){
    parts.push(`<div class="deed-pg" style="padding-top:20px;">
      <h4>${lRole} — ID Proofs</h4>
      ${lessorBlocks}
    </div>`);
  }

  // Tenant IDs — pack 2 tenants per page, each page uses deed-pg for clean break
  const lesseeBlocks=allTenants.map(p=>partyBlock(p,tRole)).filter(Boolean);
  if(lesseeBlocks.length){
    for(let i=0;i<lesseeBlocks.length;i+=2){
      const pageBlocks=lesseeBlocks.slice(i,i+2).join('');
      parts.push(`<div class="deed-pg" style="padding-top:20px;">
        <h4>${tRole} — ID Proofs${lesseeBlocks.length>2?' ('+(Math.floor(i/2)+1)+' of '+Math.ceil(lesseeBlocks.length/2)+')':''}</h4>
        ${pageBlocks}
      </div>`);
    }
  }

  return parts.join('');
}

function printLeaseDeed(){
  if(!isAdmin){toast('❌ Print is admin only');return;}
  const L=window._printL||_collectLease();
  try{
    const deedHtml=_renderDeedHTML(L);
    if(!deedHtml||deedHtml.length<100){toast('❌ No deed content — open a lease first');return;}
    const stampDiv=L.stampPaperImg
      ?`<div style="width:100%;margin:0 0 2em 0;padding:0 6mm;text-align:center;box-sizing:border-box;overflow:visible;"><img src="${L.stampPaperImg}" style="width:auto;max-width:100%;max-height:252mm;height:auto;display:block;margin:0 auto;object-fit:contain;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;"/></div>`
      :`<div style="height:125mm;display:block;width:100%;"></div>`;
    const html='<!DOCTYPE html><html><head>'
      +'<meta charset="UTF-8"/>'
      +'<meta name="viewport" content="width=device-width,initial-scale=1.0"/>'
      +'<title>Lease Deed — KD Constructions</title>'
      +'<style>'+_deedPrintCSS()+'</style>'
      +'</head><body>'
      +stampDiv+'<div class="deed-wrap">'+deedHtml+'</div>'
      +'<script>setTimeout(function(){window.print();},600);<\/script>'
      +'</body></html>';
    const w=window.open('','_blank');
    if(w){
      w.document.open();
      w.document.write(html);
      w.document.close();
    } else {
      const blob=new Blob([html],{type:'text/html'});
      const url=URL.createObjectURL(blob);
      window.open(url,'_blank');
      toast('ℹ️ If nothing opened, allow popups for this site');
    }
    actLog('Printed lease — '+(L.tenantName||L.tenantNames?.join(', ')||'')+(L.template==='ll'?' (L&L)':' (Lease)'));
  }catch(e){
    toast('❌ Print error: '+e.message);
    console.error('LeaseDesk print error:',e);
  }
}

function _avgAnnualRent(rent,tenure,escPct){
  const months=Math.max(parseInt(tenure)||0,1);
  let total=0;
  for(let m=0;m<months;m++){
    const year=Math.floor(m/12);
    total+=rent*Math.pow(1+(escPct/100),year);
  }
  return Math.round(total/(months/12));
}

function _regFeeFromAnnualRent(avgAnnualRent){
  if(avgAnnualRent<=50000)return 100;
  if(avgAnnualRent<=500000)return 1000;
  if(avgAnnualRent<=1000000)return 5000;
  if(avgAnnualRent<=2000000)return 10000;
  if(avgAnnualRent<=2500000)return 12500;
  return 15000;
}

function calcSD(){
  const rent=parseFloat(document.getElementById('sdRent').value)||0;
  const dep=parseFloat(document.getElementById('sdDep').value)||0;
  const tenure=parseInt(document.getElementById('sdTenure').value)||11;
  const esc=parseFloat(document.getElementById('sdEsc')?.value)||0;
  const firstYearRent=rent*12;
  const avgAnnualRent=_avgAnnualRent(rent,tenure,esc);
  const base=avgAnnualRent+dep;
  let stampPct=0,stampNote='';
  if(tenure<=60){stampPct=1.5;stampNote='1.5% of (Average Annual Rent + Deposit) — up to 5 years';}
  else{stampPct=3;stampNote='3% of (Average Annual Rent + Deposit) — more than 5 years';}
  const stampDuty=Math.round(base*stampPct/100);
  const regFee=_regFeeFromAnnualRent(avgAnnualRent);
  const advocateFee=7000;
  const govtTotal=stampDuty+regFee;
  const approxTotal=govtTotal+advocateFee;
  const mandatory=tenure>11;
  const el=document.getElementById('sdResult');
  el.innerHTML=`
  <div style="background:${mandatory?'var(--amber-dim)':'var(--green-dim)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;font-weight:600;color:${mandatory?'var(--amber)':'var(--green)'};">
    ${mandatory?'⚠️ Registration MANDATORY for this tenure':'ℹ️ Registration optional for agreements ≤ 11 months'}
  </div>
  ${rent?`
  <div class="irow"><span class="irow-label">First Year Annual Rent</span><span class="irow-value">${fm(firstYearRent)}</span></div>
  <div class="irow"><span class="irow-label">Average Annual Rent${esc?' (with '+esc+'% yearly escalation)':''}</span><span class="irow-value">${fm(avgAnnualRent)}</span></div>
  <div class="irow"><span class="irow-label">Security Deposit</span><span class="irow-value">${fm(dep)}</span></div>
  <div class="irow"><span class="irow-label">Base for Stamp Duty</span><span class="irow-value">${fm(base)}</span></div>
  <div class="irow"><span class="irow-label">Stamp Duty (${stampNote})</span><span class="irow-value" style="color:var(--orange);">${fm(stampDuty)}</span></div>
  <div class="irow"><span class="irow-label">Registration Fee (slab on average annual rent)</span><span class="irow-value" style="color:var(--orange);">${fm(regFee)}</span></div>
  <div class="irow"><span class="irow-label">Advocate Fees (approx)</span><span class="irow-value" style="color:var(--orange);">${fm(advocateFee)}</span></div>
  <div style="background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;margin-top:10px;"><span>Approx Total</span><span>${fm(approxTotal)}</span></div>
  <div style="font-size:10px;color:var(--muted);margin-top:8px;">Govt. charges: ${fm(govtTotal)}. Advocate fee added separately as approx. Always verify final amount with Sub-Registrar office (Gurugram) before payment.</div>`:'<div style="color:var(--muted);text-align:center;padding:12px;">Enter rent amount to calculate</div>'}`;
}

function calcTDS(){
  const rent=parseFloat(document.getElementById('tdsRent').value)||0;
  const type=document.getElementById('tdsType').value;
  const el=document.getElementById('tdsResult');
  const threshold=50000;
  if(!rent){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:12px;">Enter rent amount to calculate</div>';return;}
  const applicable=rent>threshold;
  const annualRent=rent*12;
  if(type==='individual'){
    // Section 194IB: 2% (from Oct 2024), deducted once a year (last month)
    const tdsRate=2;
    const annualTDS=Math.round(annualRent*tdsRate/100);
    const netRent=annualRent-annualTDS;
    el.innerHTML=`
    <div style="background:${applicable?'var(--amber-dim)':'var(--green-dim)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;font-weight:600;color:${applicable?'var(--amber)':'var(--green)'};">
      ${applicable?'⚠️ TDS APPLICABLE under Sec 194IB':'✅ TDS NOT applicable — rent below ₹50,000/month threshold'}
    </div>
    ${applicable?`
    <div class="irow"><span class="irow-label">Monthly Rent</span><span class="irow-value">${fm(rent)}</span></div>
    <div class="irow"><span class="irow-label">Annual Rent</span><span class="irow-value">${fm(annualRent)}</span></div>
    <div class="irow"><span class="irow-label">TDS Rate (Sec 194IB)</span><span class="irow-value">2% (reduced from 5% w.e.f. Oct 2024)</span></div>
    <div class="irow"><span class="irow-label">Annual TDS Amount</span><span class="irow-value" style="color:var(--red);">${fm(annualTDS)}</span></div>
    <div class="irow"><span class="irow-label">When to deduct</span><span class="irow-value" style="font-size:11px;">Once per year — at credit/payment of last month rent</span></div>
    <div class="irow"><span class="irow-label">Form to file</span><span class="irow-value">Form 26QC (within 30 days)</span></div>
    <div class="irow"><span class="irow-label">TAN required?</span><span class="irow-value" style="color:var(--green);">No — PAN sufficient</span></div>
    <div style="background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;margin-top:10px;"><span>Net to Landlord (annual)</span><span>${fm(netRent)}</span></div>
    <div style="font-size:10px;color:var(--muted);margin-top:8px;">Penalty for non-deduction: Interest @ 1%/month for late deduction, 1.5%/month for late deposit.</div>
    `:''}`;
  } else {
    // Section 194I: 10% for land/building, threshold ₹6L/year from Apr 2025
    const annualThreshold=600000;
    const tdsApplicable=annualRent>annualThreshold;
    const tdsRate=10;
    const annualTDS=tdsApplicable?Math.round(annualRent*tdsRate/100):0;
    el.innerHTML=`
    <div style="background:${tdsApplicable?'var(--amber-dim)':'var(--green-dim)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;font-weight:600;color:${tdsApplicable?'var(--amber)':'var(--green)'};">
      ${tdsApplicable?'⚠️ TDS APPLICABLE under Sec 194I':'✅ TDS NOT applicable — annual rent below ₹6 lakh threshold (from Apr 2025)'}
    </div>
    <div class="irow"><span class="irow-label">Annual Rent</span><span class="irow-value">${fm(annualRent)}</span></div>
    <div class="irow"><span class="irow-label">Threshold (Sec 194I)</span><span class="irow-value">₹6,00,000/year (from Apr 2025)</span></div>
    ${tdsApplicable?`
    <div class="irow"><span class="irow-label">TDS Rate (land/building)</span><span class="irow-value">10%</span></div>
    <div class="irow"><span class="irow-label">Annual TDS Amount</span><span class="irow-value" style="color:var(--red);">${fm(annualTDS)}</span></div>
    <div class="irow"><span class="irow-label">Monthly TDS</span><span class="irow-value" style="color:var(--red);">${fm(Math.round(annualTDS/12))}</span></div>
    <div class="irow"><span class="irow-label">TAN required?</span><span class="irow-value" style="color:var(--red);">Yes — TAN mandatory for Sec 194I</span></div>
    <div style="background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;margin-top:10px;"><span>Net to Landlord (annual)</span><span>${fm(annualRent-annualTDS)}</span></div>`:''}`;
  }
}

function saveStaff(){
  const name=document.getElementById('staffName').value.trim();
  const pass=document.getElementById('staffPass').value;
  const role=document.getElementById('staffRole').value;
  if(!name||!pass){toast('❌ Name and password required');return;}
  if(HARD_USERS.find(u=>u.password===pass)||(S.staff||[]).find(u=>u.password===pass)){toast('❌ Password already in use');return;}
  if(!S.staff)S.staff=[];
  S.staff.push({id:uid(),name,password:pass,role,createdAt:today(),createdBy:user});
  actLog('Added staff — '+name+' ('+role+')');
  sched();closeM();renderSettings();toast('✅ Staff added');
}

function removeStaff(id){
  if(!confirm('Remove this staff member?'))return;
  const s=(S.staff||[]).find(x=>x.id===id);
  actLog('Removed staff — '+(s?.name||id));
  S.staff=(S.staff||[]).filter(x=>x.id!==id);
  sched();renderSettings();toast('🗑 Removed');
}

function clearLog(){
  if(!confirm('Clear all activity log entries?'))return;
  S.activityLog=[];sched();renderSettings();toast('🗑 Log cleared');
}

window.addEventListener('DOMContentLoaded',()=>{
  const saved=sessionStorage.getItem('ld_user');
  if(saved){
    try{
      const{user:u,isAdmin:ia}=JSON.parse(saved);
      user=u;isAdmin=ia;
      showApp();loadData();
    }catch(e){document.getElementById('loginScreen').style.display='flex';}
  } else {
    document.getElementById('loginScreen').style.display='flex';
  }
});
</script>
</body>
</html>
